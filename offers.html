<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العروض | أنا عقار AnaAqar</title>
  <meta name="description" content="عروض حصرية من المطورين والوسطاء المرخّصين على أنا عقار: خطط سداد وخصومات وعقارات بدون عمولة.">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="icons/app-icon-v3-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a896">
  <script>try { if (localStorage.getItem('anaaqar_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aq-pages.css?v=83">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js?v=83"></script>
</head>
<body>
  <header class="topbar"><div class="topbar-in">
    <a class="brand" href="index.html"><img src="icons/logo.svg" alt="" width="98" height="30"><b>أنا عقار</b></a>
    <a class="back" href="index.html">الرئيسية ←</a>
  </div></header>
  <section class="head"><div class="head-in">
    <h1><i class="fas fa-tags"></i> العروض</h1>
    <p>عروض حصرية من المطورين والوسطاء المرخّصين على أنا عقار: خطط سداد، وخصومات، وعقارات بدون عمولة.</p>
  </div></section>
  <main>
    <div class="grid" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </main>
  <script>
    (function () {
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const safeUrl = (u) => /^(https?:\/\/|[a-z0-9_\-]+\.html)/i.test(u || '') ? u : '';
      const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
      const until = (d) => { if (!d) return ''; const p = d.split('-').map(Number); return 'العرض ساري حتى ' + p[2] + ' ' + MONTHS[p[1] - 1] + ' ' + p[0]; };
      async function load() {
        const box = document.getElementById('list');
        let data = [];
        try {
          const r = await supabaseClient.from('site_offers').select('id,title,body,badge,image_url,url,property_ids,ends_on').order('sort').order('created_at', { ascending: false });
          data = r.error ? [] : (r.data || []);
        } catch (e) {}
        if (!data.length) {
          box.outerHTML = `<div class="empty"><i class="fas fa-tags"></i><h2>لا توجد عروض في هذه الأيام</h2><p>تابعنا قريبًا، أو احفظ بحثك لنبلغك بالجديد.</p><a class="btn btn-teal" href="index.html#search">تصفّح العقارات</a></div>`;
          return;
        }
        box.innerHTML = data.map((o) => {
          const img = safeUrl(o.image_url);
          const ids = (o.property_ids || []).slice(0, 3);
          const link = safeUrl(o.url);
          return `<article class="card">
            <div class="img" style="${img ? `background-image:url('${esc(img)}')` : 'background:linear-gradient(135deg,#192038,#0b5e63)'}">${o.badge ? `<span class="bdg">${esc(o.badge)}</span>` : ''}
              ${img ? '' : '<i class="fas fa-tags" style="position:absolute;inset:0;display:grid;place-items:center;font-size:46px;color:rgba(255,255,255,.35)"></i>'}</div>
            <div class="in">
              <h2>${esc(o.title)}</h2>
              ${o.body ? `<p>${esc(o.body)}</p>` : ''}
              ${o.ends_on ? `<div class="meta"><i class="fas fa-clock"></i> ${esc(until(o.ends_on))}</div>` : ''}
              <div class="acts">
                ${ids.map((id, i) => `<a class="btn btn-teal sm" href="property-details.html?id=${encodeURIComponent(id)}"><i class="fas fa-building"></i> ${ids.length > 1 ? 'العقار ' + (i + 1) : 'عرض العقار'}</a>`).join('')}
                ${link ? `<a class="btn btn-soft sm" href="${esc(link)}" ${/^https?:/.test(link) ? 'target="_blank" rel="noopener"' : ''}><i class="fas fa-circle-info"></i> التفاصيل</a>` : ''}
                <button class="btn btn-ghost sm" type="button" data-open-chat><i class="fas fa-comment-dots"></i> استفسر عن العرض</button>
              </div>
            </div>
          </article>`;
        }).join('');
        box.querySelectorAll('[data-open-chat]').forEach((b) => b.onclick = () => window.AQEngage && AQEngage.openChat());
      }
      load();
    })();
  </script>
  <script src="js/aq-engage.js?v=83" defer></script>
  <script src="js/aq-back.js?v=83" defer></script>
</body>
</html>
