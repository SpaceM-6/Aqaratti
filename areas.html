<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل المناطق: الأسعار والإيجارات والصفقات | أنا عقار AnaAqar</title>
  <meta name="description" content="أسعار البيع لكل متر، ومتوسط الإيجارات، وعدد الصفقات المسجلة، والعائد الإيجاري، والعقارات المتاحة في كل منطقة بالإمارات.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://anaaqar.com/area/">
  <link rel="icon" type="image/png" href="icons/app-icon-v3-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a896">
  <script>try { if (localStorage.getItem('anaaqar_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aq-pages.css?v=108">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js?v=108"></script>

  <script src="js/aq-trust.js?v=108"></script>

  <style>
    .kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin:0 0 16px; }
    @media (max-width:760px) { .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    .kpi { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; min-width:0; }
    .kpi b { display:block; font-size:21px; font-weight:900; color:#0f766e; line-height:1.3; }
    [data-theme="dark"] .kpi b { color:#5eead4; }
    .kpi small { display:block; color:var(--muted); font-size:12.5px; font-weight:700; line-height:1.5; }
    .kpi .d { font-size:12px; font-weight:900; } .kpi .d.up { color:#15803d; } .kpi .d.dn { color:#b91c1c; }
    .box { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin:0 0 16px; }
    .box h2 { margin:0 0 4px; font-size:18px; font-weight:900; } .box .sub { margin:0 0 12px; color:var(--muted); font-size:13px; font-weight:600; }
    .chart svg { width:100%; max-width:760px; height:auto; display:block; margin:0 auto; direction:ltr; }
    .src { color:var(--muted); font-size:12px; font-weight:600; margin:8px 0 0; }
    .alist { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; }
    @media (max-width:760px) { .alist { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    .alist a { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; text-decoration:none; min-width:0; }
    .alist a b { display:block; font-size:15.5px; } .alist a small { display:block; color:var(--muted); font-size:12.5px; font-weight:700; }
    .srch { display:flex; gap:8px; margin:0 0 16px; } .srch input { flex:1; min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; font-family:inherit; font-size:15px; background:var(--card); color:var(--ink); }
    .pcards { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; }
    @media (max-width:860px) { .pcards { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    @media (max-width:520px) { .pcards { grid-template-columns:minmax(0, 1fr); } }
    .pc { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; text-decoration:none; min-width:0; display:flex; flex-direction:column; }
    .pc .im { aspect-ratio:16/10; background:#0f172a center/cover no-repeat; }
    .pc .tx { padding:10px 12px; } .pc b { display:block; font-size:14.5px; line-height:1.4; } .pc .pr { color:#00897b; font-weight:900; } .pc small { color:var(--muted); font-weight:700; font-size:12.5px; }
    .note2 { background:#fefce8; border:1px solid #fde68a; color:#854d0e; border-radius:14px; padding:10px 14px; font-size:13px; font-weight:700; margin:0 0 16px; }
    [data-theme="dark"] .note2 { background:#3a2f0b; border-color:#6b5513; color:#fde68a; }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-in">
    <a class="brand" href="index.html"><img src="icons/logo.svg" alt="" width="98" height="30"><b>أنا عقار</b></a>
    <a class="back" href="areas.html" id="backLink">كل المناطق ←</a>
  </div></header>
  <section class="head"><div class="head-in"><h1 id="h1"><i class="fas fa-map-location-dot"></i> دليل المناطق</h1><p id="hp">أسعار البيع لكل متر، ومتوسط الإيجارات، والصفقات المسجلة رسميًا، والعقارات المتاحة في كل منطقة.</p></div></section>
  <main id="root"><div class="empty"><i class="fas fa-spinner fa-spin"></i></div></main>
  <script>
  (function () {
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const num = (n) => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('en-US');
    const SQFT = 10.7639;

    const { AREAS, summarize, marketRows, median } = window.AQAreas;
    const slug = (s) => String(s).trim();
    const q = new URLSearchParams(location.search).get('a');

    function meta(title, desc) {
      document.title = title;
      const d = document.querySelector('meta[name="description"]'); if (d) d.content = desc;
      const c = document.querySelector('link[rel="canonical"]'); if (c) c.href = 'https://anaaqar.com/area/' + (q && window.AQAreas ? AQAreas.slug(q) + '.html' : '');
    }

    // ---------- رسم بياني: وسيط سعر المتر (خط لكل فئة) وعدد الصفقات (أعمدة) شهريًا ----------
    // base: أشهر الصفقات كلها (للأعمدة) · lines: [{name, color, dash, series}]
    function chart(base, lines) {
      if (base.length < 2) return '';
      const W = 640, H = 270, P = { l: 64, r: 40, t: 30, b: 44 };
      const idx = {}; base.forEach((r, i) => { idx[r.m] = i; });
      const xs = (i) => P.l + (W - P.l - P.r) * (base.length === 1 ? 0.5 : i / (base.length - 1));
      const all = lines.flatMap((L) => L.series.map((r) => r.ppm)).filter((v) => v != null);
      const mx = Math.max(...all), mn = Math.min(...all);
      const lo = mn - (mx - mn) * 0.15, hi = mx + (mx - mn) * 0.15 || mx * 1.1;
      const ys = (v) => P.t + (H - P.t - P.b) * (1 - (v - lo) / ((hi - lo) || 1));
      const dmax = Math.max(...base.map((r) => r.deals)), bw = Math.max(4, (W - P.l - P.r) / base.length * 0.55);
      const bars = base.map((r, i) => { const h = (H - P.t - P.b) * 0.35 * r.deals / (dmax || 1); return `<rect x="${xs(i) - bw / 2}" y="${H - P.b - h}" width="${bw}" height="${h}" rx="2" fill="#99d5ce" opacity=".5"><title>${r.m}: ${num(r.deals)} صفقة</title></rect>`; }).join('');
      const ticks = [lo + (hi - lo) * 0.15, (lo + hi) / 2, hi - (hi - lo) * 0.15].map((v) => `<line x1="${P.l}" x2="${W - P.r}" y1="${ys(v)}" y2="${ys(v)}" stroke="currentColor" opacity=".08"/><text x="${P.l - 6}" y="${ys(v) + 4}" text-anchor="end" font-size="19" fill="currentColor" opacity=".65">${num(v / 1000)}k</text>`).join('');
      const paths = lines.map((L) => {
        const pts = L.series.filter((r) => r.ppm != null && idx[r.m] != null).map((r) => [xs(idx[r.m]), ys(r.ppm), r]);
        if (!pts.length) return '';
        const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' '), last = pts[pts.length - 1];
        return `<path d="${d}" fill="none" stroke="${L.color}" stroke-width="2.6" stroke-linejoin="round"${L.dash ? ' stroke-dasharray="7 5"' : ''}/>` +
          pts.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${L.color}"><title>${L.name} ${p[2].m}: ${num(p[2].ppm)} درهم/م²</title></circle>`).join('') +
          `<text x="${last[0] - 6}" y="${last[1] - 9}" text-anchor="end" font-size="19" font-weight="800" fill="${L.color}">${num(last[2].ppm)}</text>`;
      }).join('');
      const step = Math.ceil(base.length / 6);
      const labels = base.map((r, i) => i % step && i !== base.length - 1 ? '' : `<text x="${xs(i)}" y="${H - 14}" text-anchor="middle" font-size="19" fill="currentColor" opacity=".65">${r.m.slice(2, 7).replace('-', '/')}</text>`).join('');
      const legend = lines.map((L) => `<span style="display:inline-flex;align-items:center;gap:6px;margin-inline-end:14px"><i style="display:inline-block;width:22px;border-top:3px ${L.dash ? 'dashed' : 'solid'} ${L.color}"></i>${esc(L.name)}</span>`).join('');
      return `<div class="chart" style="color:var(--ink)"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="وسيط سعر المتر المربع شهريًا">${ticks}${bars}${paths}${labels}</svg>
        <p class="src">${legend}<span>الأعمدة: عدد الصفقات · الأسعار بالدرهم لكل م²</span></p></div>`;
    }

    function card(p) {
      const url = (p.rentPeriod === 'daily' ? 'stay.html?id=' : 'property-details.html?id=') + encodeURIComponent(p.id);
      return `<a class="pc" href="${url}"><div class="im" style="background-image:url('${esc(p.image || '')}')"></div><div class="tx"><span class="pr">${num(p.priceAED)} درهم${p.dealType === 'rent' ? ' / سنويًا' : ''}</span><b>${esc(p.title)}</b>
        <small>${p.bedrooms === 0 ? 'استوديو' : p.bedrooms ? p.bedrooms + ' غرف' : ''}${p.area_m2 ? ' · ' + num(p.area_m2) + ' م²' : ''}</small>${window.AQTrust ? '<div>' + AQTrust.fresh(p) + '</div>' : ''}</div></a>`;
    }

    // ================= صفحة منطقة =================
    async function areaPage(name) {
      const known = AQAreas.find(name);
      const A = known || { ar: name, en: '', city: '', dld: [name], words: [name] };
      $('h1').innerHTML = `<i class="fas fa-map-location-dot"></i> ${esc(A.ar)}${A.en ? ` <small style="font-size:.55em;opacity:.8">${esc(A.en)}</small>` : ''}`;
      $('hp').textContent = 'أسعار البيع والإيجار والصفقات المسجلة والعقارات المتاحة' + (A.city ? ' في ' + A.ar + '، ' + A.city : '') + '.';
      meta(`${A.ar}: أسعار العقارات والإيجارات والصفقات | أنا عقار`, `متوسط سعر المتر، وعدد الصفقات المسجلة، ومتوسط الإيجار السنوي، والعائد الإيجاري، والعقارات المتاحة للبيع والإيجار في ${A.ar}.`);

      const [rows, all, projects] = await Promise.all([marketRows([...(A.dld || []), A.ar]), AQPublic.loadListings(), AQPublic.loadProjects()]);
      const W = (A.words || [A.ar]).map((w) => w.toLowerCase());
      const inArea = (t) => W.some((w) => String(t || '').toLowerCase().includes(w));
      const listings = all.filter((p) => inArea(p.title + ' ' + (p.description || '').slice(0, 200)));
      const real = listings.filter((p) => /^sb-/.test(String(p.id)));
      const prj = projects.filter((p) => inArea([p.name, p.area, p.city].join(' ')));
      const sale = summarize(rows, 'sale'), rent = summarize(rows, 'rent');
      const ready = summarize(rows, 'sale', 'ready'), offplan = summarize(rows, 'sale', 'offplan');

      // أرقام من إعلانات «أنا عقار» الحقيقية فقط (أسعار معروضة، لا صفقات)
      const ask = (deal) => median(real.filter((p) => (deal === 'rent' ? p.dealType === 'rent' && p.rentPeriod !== 'daily' : p.dealType !== 'rent') && p.priceAED > 0 && p.area_m2 > 0).map((p) => p.priceAED / p.area_m2));
      const askSale = ask('sale'), askRent = ask('rent');
      // العائد يُقاس على العقارات الجاهزة (المؤجَّرة فعلًا) متى توفرت
      const base = ready && ready.ppm ? ready : sale;
      const yieldPct = rent && base && rent.ppm && base.ppm ? rent.ppm / base.ppm * 100 : askRent && askSale ? askRent / askSale * 100 : null;
      const yieldSrc = rent && base && rent.ppm && base.ppm ? 'إيجارات دائرة الأراضي ÷ ' + (base === ready ? 'أسعار البيع الجاهز' : 'أسعار البيع') : 'تقديري من أسعار الإعلانات المعروضة';
      const kpi = (v, t, d) => `<div class="kpi"><b>${v}</b><small>${t}</small>${d || ''}</div>`;
      const delta = (c) => c == null ? '' : `<span class="d ${c >= 0 ? 'up' : 'dn'}">${c >= 0 ? '▲' : '▼'} ${Math.abs(c).toFixed(1)}% عن العام السابق</span>`;

      let html = '';
      if (sale || rent) {
        html += `<div class="kpis">${kpi(sale ? num(sale.ppm) : '—', 'وسيط سعر البيع (درهم/م²)' + (sale && sale.ppm ? ` · ${num(sale.ppm / SQFT)} للقدم²` : ''), sale ? delta(sale.change) : '')}
          ${kpi(sale ? num(sale.deals) : '—', 'صفقات بيع مسجلة (12 شهرًا)')}${kpi(rent ? num(rent.price) : '—', 'وسيط الإيجار السنوي (درهم)')}
          ${kpi(yieldPct ? yieldPct.toFixed(1) + '%' : '—', 'العائد الإيجاري الإجمالي', yieldPct ? `<span class="d" style="color:var(--muted)">${yieldSrc}</span>` : '')}</div>`;
        if (ready || offplan) html += `<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">${kpi(ready && ready.ppm ? num(ready.ppm) : '—', `<span style="color:#0f766e">●</span> البيع الجاهز (درهم/م²)${ready ? ' · ' + num(ready.deals) + ' صفقة' : ''}`)}${kpi(offplan && offplan.ppm ? num(offplan.ppm) : '—', `<span style="color:#b45309">●</span> البيع على الخارطة (درهم/م²)${offplan ? ' · ' + num(offplan.deals) + ' صفقة' : ''}`)}</div>`;
        if (sale && sale.series.length > 1) {
          const lines = ready || offplan ? [ready && { name: 'جاهز', color: '#0f766e', series: ready.series }, offplan && { name: 'على الخارطة', color: '#b45309', dash: true, series: offplan.series }].filter(Boolean) : [{ name: 'وسيط سعر البيع', color: '#0f766e', series: sale.series }];
          html += `<div class="box"><h2>حركة الأسعار والصفقات</h2><p class="sub">آخر ${sale.series.length} شهرًا من الصفقات المسجلة لدى دائرة الأراضي والأملاك${ready || offplan ? '، مع الفصل بين الجاهز وعلى الخارطة' : ''}.</p>${chart(sale.series, lines)}</div>`;
        }
      } else {
        html += `<div class="kpis">${kpi(num(real.length), 'إعلانات نشطة من وسطاء موثّقين')}${kpi(askSale ? num(askSale) : '—', 'وسيط سعر البيع المعروض (درهم/م²)')}${kpi(askRent ? num(askRent) : '—', 'وسيط الإيجار المعروض (درهم/م² سنويًا)')}${kpi(yieldPct ? yieldPct.toFixed(1) + '%' : '—', 'العائد الإيجاري التقديري')}</div>
          <div class="note2"><i class="fas fa-circle-info"></i> لم تُضف بعد صفقات دائرة الأراضي الرسمية لهذه المنطقة؛ الأرقام أعلاه من أسعار الإعلانات المعروضة على «أنا عقار» وليست أسعار بيع فعلية.</div>`;
      }
      const land = AQAreas.mergeLand(await AQAreas.landRows([...(A.dld || []), A.en].filter(Boolean)));
      const fh = land && AQAreas.freehold(land);
      if (fh) {
        const c = AQAreas.FH_COLORS[fh.cls];
        html += `<div class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><h2>الأراضي والتملّك</h2><p class="sub">من سجل الأراضي لدى دائرة الأراضي والأملاك.</p></div>
          <span style="background:${c[0]};color:${c[1]};border-radius:999px;padding:6px 14px;font-weight:900;font-size:14px"><i class="fas fa-key"></i> ${esc(fh.label)} · ${Math.round(fh.pct)}%</span></div>
          <div class="kpis" style="margin:10px 0">${kpi(num(land.plots), 'قطعة أرض مسجلة')}${kpi(Math.round(fh.pct) + '%', 'نسبة التملّك الحر في الأراضي السكنية والتجارية')}${kpi(num(land.offplan), 'قطعة عليها مشاريع على الخارطة')}${kpi(num(land.projects), 'مشروعًا مسجلًا على أراضيها')}</div>
          <b style="font-size:14px">استخدامات الأراضي</b>${AQAreas.landBars(land.land_types)}
          <p class="src">${esc(fh.note)}. الوضع النهائي لكل عقار يُؤكَّد من سند ملكيته. <a href="lands.html">دليل الأراضي والتملّك الحر ←</a></p></div>`;
      }
      const dp = await AQAreas.dldProjects([...(A.dld || []), A.en].filter(Boolean), 30);
      if (dp.length) { AQAreas.projectCss(); html += `<div class="box"><h2>مشاريع جديدة مسجلة لدى دائرة الأراضي (${num(dp.length)})</h2><p class="sub">نسبة الإنجاز حسب آخر تفتيش رسمي، وموعد التسليم المتوقع، وعدد الوحدات.</p><div class="dldgrid">${dp.slice(0, 9).map(AQAreas.projectCard).join('')}</div>${dp.length > 9 ? `<div class="acts" style="margin-top:12px"><a class="btn btn-soft sm" href="projects.html?area=${encodeURIComponent((A.dld || [A.en])[0] || '')}#dld">عرض الكل</a></div>` : ''}</div>`; }
      if (prj.length) html += `<div class="box"><h2>مشاريع على الخارطة في ${esc(A.ar)}</h2><div class="pcards">${prj.slice(0, 6).map((p) => `<a class="pc" href="project.html?id=${p.id}"><div class="im" style="background-image:url('${esc((p.images || [])[0] || '')}')"></div><div class="tx"><b>${esc(p.name)}</b><small>${p.price_from ? 'يبدأ من ' + num(p.price_from) + ' درهم' : ''}${p.handover ? ' · التسليم ' + esc(p.handover) : ''}</small></div></a>`).join('')}</div></div>`;
      const forSale = listings.filter((p) => p.dealType !== 'rent'), forRent = listings.filter((p) => p.dealType === 'rent');
      const best = (l) => l.slice().sort((a, b) => (/^sb-/.test(String(b.id)) - /^sb-/.test(String(a.id))) || ((b.checks && b.checks.available ? 1 : 0) - (a.checks && a.checks.available ? 1 : 0))).slice(0, 6);
      if (forSale.length) html += `<div class="box"><h2>للبيع في ${esc(A.ar)} (${num(forSale.length)})</h2><div class="pcards">${best(forSale).map(card).join('')}</div><div class="acts" style="margin-top:12px"><a class="btn btn-soft sm" href="listings.html?deal=sale&q=${encodeURIComponent(A.ar)}">عرض الكل</a></div></div>`;
      if (forRent.length) html += `<div class="box"><h2>للإيجار في ${esc(A.ar)} (${num(forRent.length)})</h2><div class="pcards">${best(forRent).map(card).join('')}</div><div class="acts" style="margin-top:12px"><a class="btn btn-soft sm" href="listings.html?deal=rent&q=${encodeURIComponent(A.ar)}">عرض الكل</a></div></div>`;
      if (!forSale.length && !forRent.length) html += `<div class="empty"><i class="fas fa-house"></i><h2>لا توجد إعلانات في ${esc(A.ar)} حاليًا</h2><p>اترك طلبك وسيتواصل معك الوسطاء عند توفر ما يناسبك.</p><a class="btn btn-teal" href="request.html">اطلب عقارك</a></div>`;
      html += `<div class="acts" style="margin:6px 0 14px"><a class="btn btn-ghost sm" href="map.html"><i class="fas fa-map"></i> الخريطة</a><a class="btn btn-ghost sm" href="valuation.html"><i class="fas fa-calculator"></i> قيّم عقارك</a><button class="btn btn-ghost sm" type="button" data-share-url="areas.html?a=${encodeURIComponent(A.ar)}" data-share-title="${esc(A.ar + ': أسعار العقارات والإيجارات | أنا عقار')}"><i class="fas fa-share-nodes"></i> مشاركة</button></div>
        <p class="src">المصادر: البيانات المفتوحة لدائرة الأراضي والأملاك في دبي (صفقات البيع المسجلة وعقود الإيجار، ملخصة شهريًا)، وإعلانات «أنا عقار». العائد الإيجاري إجمالي قبل الرسوم والصيانة. الأرقام للاسترشاد ولا تغني عن تقييم معتمد.</p>`;
      $('root').innerHTML = html;
    }

    // ================= فهرس المناطق =================
    async function indexPage() {
      meta('دليل المناطق: الأسعار والإيجارات والصفقات | أنا عقار', 'أسعار البيع لكل متر، ومتوسط الإيجارات، وعدد الصفقات المسجلة، والعائد الإيجاري، والعقارات المتاحة في كل منطقة بالإمارات.');
      $('backLink').href = 'index.html'; $('backLink').textContent = 'الرئيسية ←';
      let dld = [];
      try {
        const since = new Date(); since.setMonth(since.getMonth() - 14);
        const r = { data: [] };
        for (let off = 0; off < 30000; off += 1000) {
          const part = await supabaseClient.from('area_market_stats').select('*').eq('kind', 'sale').gte('month', since.toISOString().slice(0, 10)).order('area_en').order('month').range(off, off + 999);
          r.data = r.data.concat(part.data || []); if (part.error || (part.data || []).length < 1000) break;
        }
        const by = {}; (r.data || []).filter((x) => (x.segment || 'all') === 'all').forEach((x) => { by[x.area_en] = by[x.area_en] || { en: x.area_en, ar: x.area_ar, deals: 0 }; by[x.area_en].deals += x.deals; });
        dld = Object.values(by).sort((a, b) => b.deals - a.deals);
      } catch (e) {}
      const mapped = new Set(AREAS.flatMap((a) => a.dld || []).map((x) => x.toLowerCase()));
      const tile = (href, b, s) => `<a href="${href}"><b>${esc(b)}</b><small>${esc(s)}</small></a>`;
      $('root').innerHTML = `<div class="srch"><input id="as" type="search" placeholder="ابحث عن منطقة… مثل: دبي مارينا"></div>
        <a href="lands.html" style="display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;margin:0 0 16px"><i class="fas fa-key" style="color:#0f766e;font-size:20px"></i><span><b>أين يحق لغير المواطنين التملّك؟</b><br><small style="color:var(--muted);font-weight:700">دليل الأراضي والتملّك الحر لكل منطقة ←</small></span></a>
        <h2 style="font-size:19px;margin:0 0 10px">مناطق مطلوبة</h2><div class="alist" id="al">${AREAS.map((a) => tile('areas.html?a=' + encodeURIComponent(a.ar), a.ar, a.en + ' · ' + a.city)).join('')}</div>
        ${dld.length ? `<h2 style="font-size:19px;margin:20px 0 10px">كل المناطق بحسب الصفقات المسجلة</h2><div class="alist" id="al2">${dld.filter((d) => !mapped.has(d.en.toLowerCase())).slice(0, 120).map((d) => tile('areas.html?a=' + encodeURIComponent(d.en), d.ar || d.en, (d.ar ? d.en + ' · ' : '') + num(d.deals) + ' صفقة في آخر سنة')).join('')}</div>` : ''}`;
      $('as').oninput = (e) => { const t = e.target.value.trim().toLowerCase(); document.querySelectorAll('.alist a').forEach((a) => { a.hidden = !!t && !a.textContent.toLowerCase().includes(t); }); };
    }

    (q ? areaPage(slug(q)) : indexPage()).catch(() => { $('root').innerHTML = '<div class="empty"><h2>تعذّر التحميل</h2></div>'; });
  })();
  </script>
  <script src="js/aq-engage.js?v=108" defer></script>
  <script src="js/aq-back.js?v=108" defer></script>
  <script src="js/aq-ads.js?v=108" defer></script>
</body>
