<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المواصلات في دبي: محطات المترو والترام | أنا عقار</title>
  <meta name="description" content="محطات المترو والترام في دبي من بيانات هيئة الطرق والمواصلات، مع العقارات القريبة من كل محطة.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://anaaqar.com/transport.html">
  <meta property="og:title" content="المواصلات في دبي">
  <meta property="og:description" content="محطات المترو والترام في دبي من بيانات هيئة الطرق والمواصلات، مع العقارات القريبة من كل محطة.">
  <meta property="og:image" content="https://anaaqar.com/icons/icon-app-1024.png">
  <link rel="icon" type="image/png" href="icons/app-icon-v4-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a896">
  <script>try { if (localStorage.getItem('anaaqar_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aq-pages.css?v=116">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js?v=116"></script>
  <script src="js/aq-public.js?v=116"></script>
  <script src="js/aq-areas.js?v=116"></script>
  <style>
    .tools { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin:0 0 12px; } @media (max-width:700px) { .tools { grid-template-columns:1fr 1fr; } .tools input { grid-column:1/-1; } }
    .tools input, .tools select { min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font:700 15px 'Tajawal', sans-serif; background:var(--card); color:var(--ink); }
    .kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin:0 0 14px; } @media (max-width:700px) { .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; } .kpi b { display:block; font-size:20px; font-weight:900; color:#0f766e; } .kpi small { color:var(--muted); font-weight:700; font-size:12.5px; }
    [data-theme="dark"] .kpi b { color:#5eead4; }
    .list { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; } @media (max-width:700px) { .list { grid-template-columns:minmax(0, 1fr); } }
    .it { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; min-width:0; }
    .it .t { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; } .it b { font-size:16px; line-height:1.5; } .it small { display:block; color:var(--muted); font-weight:700; font-size:13px; line-height:1.8; }
    .pill { flex:0 0 auto; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:900; }
    .lk { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; } .lk a { font-weight:800; font-size:13.5px; color:var(--teal-dark, #0f766e); text-decoration:none; }
    .empty { text-align:center; padding:26px 16px; background:var(--card); border:1px solid var(--line); border-radius:18px; color:var(--muted); font-weight:700; line-height:1.9; }
    .src { color:var(--muted); font-size:12px; font-weight:600; margin:12px 0 0; } .more { text-align:center; margin:12px 0; }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-in"><a class="brand" href="index.html"><img src="icons/logo.svg" alt="" width="98" height="30"><b>أنا عقار</b></a><a class="back" href="area/">دليل المناطق ←</a></div></header>
  <section class="head"><div class="head-in"><h1><i class="fas fa-train-subway"></i> المواصلات في دبي</h1><p>محطات المترو والترام وغيرها من بيانات هيئة الطرق والمواصلات، لتختار سكنًا قريبًا من محطة.</p></div></section>
  <main>
    <div class="tools"><input id="q" type="search" placeholder="ابحث باسم المحطة أو المنطقة" autocomplete="off"><select id="kd"><option value="">كل الوسائل</option></select><select id="ln"><option value="">كل الخطوط</option></select></div>
    <div class="kpis" id="k"></div>
    <div id="out" class="list"></div><div class="more" id="more"></div>
    <p class="src">المصدر: البيانات المفتوحة لهيئة الطرق والمواصلات في دبي (RTA) عبر منصة دبي للبيانات.</p>
  </main>
  <script>
    (async () => {
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const arArea = (en) => { try { const a = window.AQAreas && AQAreas.find(en); return a ? a.ar : en; } catch (e) { return en; } };
      const K = { metro: ['مترو', 'fa-train-subway'], tram: ['ترام', 'fa-train-tram'], bus: ['حافلات', 'fa-bus'], marine: ['مواصلات بحرية', 'fa-ferry'] };
      const out = document.getElementById('out');
      let all = [];
      try { for (let off = 0; off < 20000; off += 1000) { const r = await supabaseClient.from('transit_stations').select('*').range(off, off + 999); if (r.error) break; all = all.concat(r.data || []); if ((r.data || []).length < 1000) break; } } catch (e) {}
      if (!all.length) { out.outerHTML = '<div class="empty"><i class="fas fa-train-subway" style="font-size:30px;color:#0f766e"></i><br>نجهّز دليل محطات المترو والترام من بيانات هيئة الطرق الرسمية، ويظهر هنا قريبًا.<br><a class="btn btn-teal" href="map.html" style="margin-top:10px;display:inline-flex">العقارات على الخريطة</a></div>'; return; }
      document.getElementById('kd').innerHTML += Object.keys(K).filter((k) => all.some((s) => s.kind === k)).map((k) => `<option value="${k}">${K[k][0]}</option>`).join('');
      const lines = [...new Set(all.map((s) => s.line).filter(Boolean))].sort();
      document.getElementById('ln').innerHTML += lines.map((l) => `<option>${esc(l)}</option>`).join('');
      if (!lines.length) document.getElementById('ln').style.display = 'none';
      let shown = 60;
      const draw = () => {
        const q = document.getElementById('q').value.trim().toLowerCase(), kd = document.getElementById('kd').value, ln = document.getElementById('ln').value;
        const L = all.filter((s) => (!kd || s.kind === kd) && (!ln || s.line === ln) && (!q || [s.name_en, s.name_ar, s.line, s.area_en, arArea(s.area_en || '')].join(' ').toLowerCase().includes(q))).sort((a, b) => String(a.line || '').localeCompare(String(b.line || '')) || String(a.name_en).localeCompare(String(b.name_en)));
        const by = {}; L.forEach((s) => { by[s.kind] = (by[s.kind] || 0) + 1; });
        document.getElementById('k').innerHTML = `<div class="kpi"><b>${L.length}</b><small>محطة</small></div>` + Object.entries(by).slice(0, 3).map(([k, n]) => `<div class="kpi"><b>${n}</b><small>${(K[k] || [k])[0]}</small></div>`).join('');
        out.innerHTML = L.slice(0, shown).map((s) => `<div class="it"><div class="t"><b><i class="fas ${(K[s.kind] || K.metro)[1]}" style="color:#0f766e"></i> ${esc(s.name_ar || s.name_en)}</b>${s.line ? `<span class="pill" style="background:#e6f7f5;color:#0f766e">${esc(s.line)}</span>` : ''}</div>
          <small>${s.name_ar && s.name_en ? esc(s.name_en) + ' · ' : ''}${(K[s.kind] || K.metro)[0]}${s.area_en ? ' · قرب ' + esc(arArea(s.area_en)) : ''}</small>
          <div class="lk">${s.lat && s.lng ? `<a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener"><i class="fas fa-location-dot"></i> الموقع</a><a href="map.html?lat=${s.lat}&lng=${s.lng}&z=14">عقارات حول المحطة</a>` : `<a href="https://www.google.com/maps/search/${encodeURIComponent(s.name_en + ' metro station Dubai')}" target="_blank" rel="noopener"><i class="fas fa-location-dot"></i> الموقع</a>`}${s.area_en ? `<a href="listings.html?q=${encodeURIComponent(arArea(s.area_en))}">عقارات في ${esc(arArea(s.area_en))}</a>` : ''}</div></div>`).join('') || '<div class="empty" style="grid-column:1/-1">لا محطات تطابق البحث.</div>';
        document.getElementById('more').innerHTML = L.length > shown ? `<button class="btn btn-soft" id="mb">عرض المزيد (${L.length - shown})</button>` : '';
        const mb = document.getElementById('mb'); if (mb) mb.onclick = () => { shown += 60; draw(); };
      };
      ['q', 'kd', 'ln'].forEach((id) => document.getElementById(id).addEventListener(id === 'q' ? 'input' : 'change', () => { shown = 60; draw(); }));
      draw();
    })();
  </script>
  <script src="js/aq-engage.js?v=116" defer></script>
  <script src="js/aq-back.js?v=116" defer></script>
  <script src="js/aq-ads.js?v=116" defer></script>
</body>
</html>
