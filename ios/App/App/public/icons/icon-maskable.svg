<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="turquoiseGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8b3"/>
      <stop offset="100%" stop-color="#008072"/>
    </linearGradient>
    <linearGradient id="goldGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#997a15"/>
    </linearGradient>
  </defs>
  <!-- خلفية كاملة بلا حواف مقصوصة لتوافق الأيقونات القابلة للقص (Maskable) في أندرويد -->
  <rect x="0" y="0" width="100" height="100" fill="url(#turquoiseGradM)"/>
  <!-- الشعار مصغر ومتمركز داخل المنطقة الآمنة (Safe Zone) -->
  <g transform="translate(50,50) scale(0.62) translate(-50,-50)">
    <path d="M25 48 L50 24 L75 48" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="58" r="14" fill="none" stroke="url(#goldGradM)" stroke-width="6"/>
    <path d="M60 68 L72 80" stroke="url(#goldGradM)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
