<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة المهنيين | أنا عقار AnaAqar</title>
  <meta name="description" content="بوابة الوسطاء والمكاتب العقارية والمطورين في أنا عقار: إدارة العقارات والعملاء والمهام والفريق والتقارير.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="icons/app-icon-v3-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a896">
  <script>try { if (localStorage.getItem('anaaqar_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aq-pages.css?v=84">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js?v=84"></script>
  <style>
    .shell { max-width:1200px; margin:0 auto; display:grid; grid-template-columns:230px minmax(0,1fr); gap:18px; padding:18px 16px 100px; }
    .side { position:sticky; top:70px; align-self:start; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:10px; }
    .side .who { padding:8px 10px 12px; border-bottom:1px solid var(--line); margin-bottom:6px; }
    .side .who b { display:block; font-size:15px; } .side .who small { color:var(--muted); font-weight:700; }
    .nav a { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; text-decoration:none; font-weight:800; font-size:14.5px; color:var(--ink); }
    .nav a i { width:20px; text-align:center; color:var(--teal); }
    .nav a.on { background:var(--teal-soft); color:var(--teal-dark); }
    [data-theme="dark"] .nav a.on { color:#5eead4; }
    .nav a .n { margin-right:auto; background:var(--red); color:#fff; border-radius:999px; font-size:11px; padding:0 7px; }
    .nav a .n:empty { display:none; }
    @media (max-width:860px) {
      .shell { grid-template-columns:minmax(0,1fr); padding-top:10px; }
      .side { position:sticky; top:56px; z-index:15; padding:6px; border-radius:14px; }
      .side .who { display:none; }
      .nav { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; }
      .nav::-webkit-scrollbar { display:none; }
      .nav a { flex:0 0 auto; padding:8px 12px; font-size:13.5px; white-space:nowrap; }
    }
    h1.pg { margin:0 0 4px; font-size:24px; font-weight:900; } .pgsub { color:var(--muted); margin:0 0 16px; font-size:14px; }
    .kpis { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:16px; }
    @media (max-width:760px) { .kpis { grid-template-columns:repeat(2, minmax(0,1fr)); } }
    .kpi { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
    .kpi b { display:block; font-size:26px; font-weight:900; line-height:1.2; } .kpi span { color:var(--muted); font-size:13px; font-weight:700; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; }
    .panel h2 { margin:0 0 10px; font-size:17px; font-weight:900; display:flex; align-items:center; gap:8px; justify-content:space-between; flex-wrap:wrap; }
    .banner { border-radius:16px; padding:14px 16px; margin-bottom:14px; display:flex; gap:12px; align-items:flex-start; font-weight:700; }
    .banner.warn { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; }
    .banner.ok { background:var(--teal-soft); border:1px solid var(--teal); color:var(--teal-dark); }
    .banner.hot { background:linear-gradient(135deg,#192038,#0b5e63); color:#fff; border:0; }
    [data-theme="dark"] .banner.warn { background:#2b1d0f; border-color:#7c2d12; color:#fdba74; }
    .pill2 { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:900; padding:3px 10px; border-radius:999px; background:#f1f5f9; color:#334155; }
    .st-new { background:#e0f2fe; color:#075985; } .st-contacted { background:#fef3c7; color:#92400e; } .st-viewing { background:#ede9fe; color:#5b21b6; }
    .st-negotiating { background:#ffedd5; color:#9a3412; } .st-won { background:#dcfce7; color:#166534; } .st-lost { background:#f1f5f9; color:#64748b; }
    .sc-hot { background:#fee2e2; color:#b91c1c; } .sc-warm { background:#fef3c7; color:#92400e; } .sc-cold { background:#e0f2fe; color:#075985; }
    .st-approved { background:#dcfce7; color:#166534; } .st-pending { background:#fef3c7; color:#92400e; } .st-rejected { background:#fee2e2; color:#b91c1c; } .st-paused, .st-sold, .st-rented { background:#f1f5f9; color:#475569; }
    .list .li { display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); }
    .list .li:last-child { border-bottom:0; }
    .li .th { width:64px; height:64px; border-radius:12px; background:#0f172a center/cover; flex:0 0 auto; }
    .li .tx { flex:1; min-width:0; } .li .tx b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .li .tx small { color:var(--muted); font-size:13px; display:block; }
    .li .ac { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    @media (max-width:620px) { .list .li { flex-wrap:wrap; } .li .ac { width:100%; justify-content:flex-start; } }
    .stages { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-bottom:12px; }
    .stages button { flex:0 0 auto; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:7px 14px; font:inherit; font-weight:800; font-size:13.5px; cursor:pointer; }
    .stages button.on { background:var(--navy); border-color:var(--navy); color:#fff; }
    .stages button span { opacity:.7; }
    .lead { cursor:pointer; }
    .drawer-ov { position:fixed; inset:0; background:rgba(2,8,23,.55); z-index:60; display:flex; justify-content:flex-start; }
    .drawer { background:var(--bg); width:min(560px, 100%); height:100%; overflow-y:auto; padding:16px; box-shadow:-10px 0 30px rgba(0,0,0,.2); animation:slideIn .25s ease-out; }
    @keyframes slideIn { from { transform:translateX(-30px); opacity:0; } to { transform:none; opacity:1; } }
    .drawer .x { float:left; width:38px; height:38px; border-radius:10px; border:0; background:var(--card); color:var(--ink); font-size:18px; cursor:pointer; }
    .tl { list-style:none; margin:0; padding:0; } .tl li { border-right:3px solid var(--teal); padding:6px 12px; margin:8px 0; background:var(--card); border-radius:10px; font-size:14px; white-space:pre-wrap; }
    .tl li small { display:block; color:var(--muted); font-size:12px; }
    .quick { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
    .task { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
    .task input[type=checkbox] { width:22px; height:22px; margin-top:2px; accent-color:var(--teal); }
    .task.done b { text-decoration:line-through; color:var(--muted); }
    .task .due { font-size:12.5px; font-weight:800; } .task .due.late { color:var(--red); }
    .bar { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13.5px; font-weight:700; }
    .bar .lb { width:110px; flex:0 0 auto; } .bar .tr { flex:1; height:12px; background:var(--line); border-radius:6px; overflow:hidden; } .bar .tr i { display:block; height:100%; background:var(--teal); border-radius:6px; }
    .bar .vl { width:44px; text-align:left; }
    .rows-ed .r { display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:6px; margin-bottom:6px; }
    .rows-ed .r input { border:1.5px solid var(--line); border-radius:10px; padding:8px; font:inherit; background:var(--card); color:var(--ink); min-width:0; }
    .auth { max-width:520px; margin:28px auto; }
    .types { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:12px; }
    .types button { border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:14px; padding:12px 6px; font:inherit; font-weight:800; cursor:pointer; display:flex; flex-direction:column; gap:6px; align-items:center; }
    .types button i { font-size:20px; color:var(--teal); } .types button.on { border-color:var(--teal); background:var(--teal-soft); }
    .mut { color:var(--muted); font-size:13px; }
    .gridf { display:grid; grid-template-columns:1fr 1fr; gap:10px; } @media (max-width:620px) { .gridf { grid-template-columns:1fr; } }
    .chk { display:flex; align-items:center; gap:8px; font-weight:700; margin:6px 0; } .chk input { width:20px; height:20px; accent-color:var(--teal); }
  </style>
</head>
<body data-no-ticker>
  <header class="topbar"><div class="topbar-in">
    <a class="brand" href="index.html"><img src="icons/logo.svg" alt="" width="98" height="30"><b>أنا عقار</b></a>
    <span style="display:flex;gap:14px;align-items:center"><a class="back" href="index.html">الموقع ←</a><button class="btn btn-ghost sm" id="logoutBtn" hidden>خروج</button></span>
  </div></header>
  <div id="root"><div class="shell" style="display:block"><div class="skel"></div></div></div>

  <script src="currency.js"></script>
  <script src="js/aq-ai.js?v=84"></script>
  <script>
  (function () {
    'use strict';
    const sb = supabaseClient;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (t) => { try { return new Date(t).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ''; } };
    const fmtD = (t) => { try { return new Date(t).toLocaleDateString('ar-EG', { day: 'numeric', month: 'short' }); } catch (e) { return ''; } };
    const money = (n) => n == null || n === '' ? '—' : Number(n).toLocaleString('en-US') + ' درهم';
    const wa = (p) => String(p || '').replace(/\D/g, '').replace(/^0/, '971');
    const toast = (m, bad) => { const d = document.createElement('div'); d.style.cssText = `position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:${bad ? '#b91c1c' : '#192038'};color:#fff;padding:11px 18px;border-radius:12px;font-weight:800;z-index:99;max-width:92vw`; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 3000); };
    const setupErr = (e) => /does not exist|schema cache|function .* does not exist|column/.test((e && e.message) || '') ? 'هذا القسم يحتاج تشغيل ملف supabase/portal.sql أولًا.' : 'تعذّر التحميل: ' + esc(e && e.message);
    const LS = { get: (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

    const TYPES = { broker: ['وسيط فرد', 'fa-user-tie'], office: ['مكتب عقاري', 'fa-building-user'], developer: ['مطوّر عقاري', 'fa-city'] };
    const STAGES = { new: 'جديد', contacted: 'تم التواصل', viewing: 'معاينة', negotiating: 'تفاوض', won: 'تمت الصفقة', lost: 'لم يتم' };
    const PSTATUS = { approved: 'منشور', pending: 'قيد المراجعة', rejected: 'مرفوض', paused: 'موقوف مؤقتًا', sold: 'تم البيع', rented: 'تم التأجير' };
    const KINDS = { note: ['ملاحظة', 'fa-note-sticky'], call: ['اتصال', 'fa-phone'], whatsapp: ['واتساب', 'fa-whatsapp'], email: ['بريد', 'fa-envelope'], meeting: ['اجتماع/معاينة', 'fa-handshake'], stage: ['تغيير المرحلة', 'fa-arrow-left'] };
    const PRI = { urgent: ['عاجل', '#b91c1c'], high: ['مهم', '#c2410c'], medium: ['متوسط', '#0369a1'], low: ['عادي', '#64748b'] };
    const WA_TPL_DEFAULT = [
      'السلام عليكم {name}، معك {me} من أنا عقار. وصلنا استفسارك عن {property}، متى يناسبك نتواصل؟',
      'أهلًا {name}، هل يناسبك موعد لمعاينة {property} هذا الأسبوع؟',
      'مرحبًا {name}، عندنا خيارات جديدة تناسب طلبك، هل أرسلها لك؟',
      'شكرًا لوقتك {name}، أي استفسار أنا في خدمتك.'
    ];

    let user = null, me = null, team = [], leads = [], stats = {}, current = '';

    // ===================== الدخول والتسجيل =====================
    async function boot() {
      const { data } = await sb.auth.getSession();
      user = data.session && data.session.user;
      if (!user) return authView('login');
      $('logoutBtn').hidden = false;
      const r = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
      me = r.data || { id: user.id, account_type: 'user' };
      if (!me.account_type || me.account_type === 'user') return upgradeView();
      shell();
    }
    $('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.hash = ''; location.reload(); };

    function authView(mode) {
      let type = 'broker';
      $('root').innerHTML = `<div class="auth"><div class="panel">
        <h1 class="pg">${mode === 'login' ? 'دخول بوابة المهنيين' : 'حساب مهني جديد'}</h1>
        <p class="pgsub">للوسطاء الأفراد والمكاتب العقارية والمطوّرين: أدر عقاراتك وعملاءك وفريقك من مكان واحد.</p>
        <div class="tabs"><button class="tab ${mode === 'login' ? 'on' : ''}" data-m="login">تسجيل الدخول</button><button class="tab ${mode === 'signup' ? 'on' : ''}" data-m="signup">حساب جديد</button></div>
        <form id="af" novalidate>
          ${mode === 'signup' ? `<div class="types">${Object.entries(TYPES).map(([k, [t, i]]) => `<button type="button" data-t="${k}" class="${k === 'broker' ? 'on' : ''}"><i class="fas ${i}"></i>${t}</button>`).join('')}</div>
            <div class="fg"><label>الاسم الكامل</label><input id="aName" autocomplete="name" required></div>
            <div class="fg" id="coWrap" hidden><label id="coLbl">اسم المكتب</label><input id="aCo"></div>
            <div class="gridf"><div class="fg"><label>رقم الجوال</label><input id="aPhone" type="tel" dir="ltr" autocomplete="tel"></div>
            <div class="fg"><label id="licLbl">رقم ترخيص الوسيط (BRN)</label><input id="aLic" dir="ltr"></div></div>` : ''}
          <div class="fg"><label>البريد الإلكتروني</label><input id="aEmail" type="email" dir="ltr" autocomplete="username" required></div>
          <div class="fg"><label>كلمة المرور</label><input id="aPass" type="password" dir="ltr" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" required></div>
          <p class="mut" id="aMsg"></p>
          <button class="btn btn-teal" style="width:100%" type="submit">${mode === 'login' ? 'دخول' : 'إنشاء الحساب'}</button>
          ${mode === 'login' ? '<button class="btn btn-ghost sm" type="button" id="forgot" style="margin-top:8px">نسيت كلمة المرور؟</button>' : '<p class="mut" style="margin-top:8px">يُراجع فريق أنا عقار رقم الترخيص ويوثّق حسابك، فتظهر علامة «موثّق» على ملفك وإعلاناتك.</p>'}
        </form></div></div>`;
      document.querySelectorAll('.tab[data-m]').forEach((b) => b.onclick = () => authView(b.dataset.m));
      document.querySelectorAll('.types button').forEach((b) => b.onclick = () => {
        type = b.dataset.t; document.querySelectorAll('.types button').forEach((x) => x.classList.toggle('on', x === b));
        $('coWrap').hidden = type === 'broker'; $('coLbl').textContent = type === 'office' ? 'اسم المكتب' : 'اسم شركة التطوير';
        $('licLbl').textContent = type === 'broker' ? 'رقم ترخيص الوسيط (BRN)' : type === 'office' ? 'رقم ترخيص المكتب (ORN)' : 'رقم الرخصة التجارية';
      });
      const f = $('forgot'); if (f) f.onclick = async () => {
        const email = $('aEmail').value.trim(); if (!email) return ($('aMsg').textContent = 'اكتب بريدك أولًا.');
        await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        $('aMsg').textContent = 'أرسلنا لك رابط إعادة تعيين كلمة المرور على بريدك.';
      };
      $('af').onsubmit = async (e) => {
        e.preventDefault();
        const email = $('aEmail').value.trim(), password = $('aPass').value;
        if (!email || password.length < 6) return ($('aMsg').textContent = 'اكتب البريد وكلمة مرور من 6 أحرف على الأقل.');
        if (mode === 'login') {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) return ($('aMsg').textContent = 'البريد أو كلمة المرور غير صحيحة.');
          return boot();
        }
        const name = $('aName').value.trim(); if (name.length < 2) return ($('aMsg').textContent = 'اكتب اسمك.');
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname,
          data: { full_name: name, phone: $('aPhone').value.trim(), account_type: type, company_name: ($('aCo').value || '').trim(), license_no: $('aLic').value.trim() } } });
        if (error) return ($('aMsg').textContent = /already/.test(error.message) ? 'هذا البريد مسجّل مسبقًا، سجّل الدخول.' : 'تعذّر إنشاء الحساب: ' + error.message);
        if (data.session) return boot();
        $('root').innerHTML = `<div class="auth"><div class="panel ok"><i class="fas fa-envelope-circle-check" style="font-size:44px;color:var(--teal)"></i><h2>أكّد بريدك الإلكتروني</h2><p class="mut">أرسلنا رابط التفعيل إلى ${esc(email)}. افتحه ثم ادخل إلى البوابة.</p></div></div>`;
      };
    }

    function upgradeView() {
      let type = 'broker';
      $('root').innerHTML = `<div class="auth"><div class="panel"><h1 class="pg">فعّل حسابك المهني</h1>
        <p class="pgsub">حسابك الحالي حساب زائر. اختر نوع نشاطك لتفتح لك أدوات البوابة.</p>
        <div class="types">${Object.entries(TYPES).map(([k, [t, i]]) => `<button type="button" data-t="${k}" class="${k === 'broker' ? 'on' : ''}"><i class="fas ${i}"></i>${t}</button>`).join('')}</div>
        <div class="fg" id="coWrap" hidden><label>اسم المكتب أو الشركة</label><input id="uCo" value="${esc(me.company_name || me.agency || '')}"></div>
        <div class="fg"><label>رقم الترخيص</label><input id="uLic" dir="ltr" value="${esc(me.license_no || '')}"></div>
        <button class="btn btn-teal" style="width:100%" id="uGo">متابعة</button></div></div>`;
      document.querySelectorAll('.types button').forEach((b) => b.onclick = () => { type = b.dataset.t; document.querySelectorAll('.types button').forEach((x) => x.classList.toggle('on', x === b)); $('coWrap').hidden = type === 'broker'; });
      $('uGo').onclick = async () => {
        const { error } = await sb.from('profiles').update({ account_type: type, company_name: $('uCo').value.trim() || null, license_no: $('uLic').value.trim() || null }).eq('id', user.id);
        if (error) return toast(setupErr(error), true);
        boot();
      };
    }

    // ===================== الهيكل والتنقل =====================
    const SECTIONS = () => [
      ['home', 'لوحتي', 'fa-gauge'],
      ['leads', 'العملاء', 'fa-address-book'],
      ['tasks', 'المهام', 'fa-list-check'],
      ['listings', 'عقاراتي', 'fa-building'],
      ['bookings', 'الحجوزات', 'fa-calendar-check'],
      ...(me.account_type === 'developer' ? [['projects', 'مشاريعي', 'fa-city']] : []),
      ['requests', 'طلبات المشترين', 'fa-magnifying-glass-location'],
      ...(me.account_type === 'office' ? [['team', 'فريقي', 'fa-people-group']] : []),
      ['reports', 'التقارير', 'fa-chart-pie'],
      ['profile', 'ملفي', 'fa-id-card']
    ];
    function shell() {
      const name = me.company_name || me.full_name || user.email;
      $('root').innerHTML = `<div class="shell"><aside class="side"><div class="who"><b>${esc(name)}</b><small>${TYPES[me.account_type][0]}${me.verified ? ' · <span style="color:var(--teal)"><i class="fas fa-circle-check"></i> موثّق</span>' : ''}</small></div>
        <nav class="nav">${SECTIONS().map(([k, t, i]) => `<a href="#${k}" data-k="${k}"><i class="fas ${i}"></i>${t}<span class="n" id="nb-${k}"></span></a>`).join('')}</nav></aside>
        <main id="main" style="padding:0;min-width:0"></main></div>`;
      window.addEventListener('hashchange', route);
      route();
      loadTeam();
    }
    const RENDER = { home: renderHome, leads: renderLeads, tasks: renderTasks, listings: renderListings, bookings: renderBookings, projects: renderProjects, requests: renderRequests, team: renderTeam, reports: renderReports, profile: renderProfile };
    function route() {

      const byStage = {}; Object.entries(STAGES).forEach(([k, t]) => { byStage[t] = leads.filter((l) => (l.stage || 'new') === k).length; });
      const bySrc = {}; leads.forEach((l) => { const k = l.source === 'website' || !l.source ? 'الموقع' : l.source; bySrc[k] = (bySrc[k] || 0) + 1; });
      const acts = {}; (a.data || []).forEach((x) => { const k = KINDS[x.kind][0]; acts[k] = (acts[k] || 0) + 1; });
      const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(Date.now() - i * 864e5); const key = d.toISOString().slice(0, 10); days.push([d.getDate(), leads.filter((l) => l.created_at.slice(0, 10) === key).length]); }
      const maxD = Math.max(1, ...days.map((x) => x[1]));
      const topViews = ps.slice().sort((x, y) => y.views_30d - x.views_30d).slice(0, 8);
      m.innerHTML = `<h1 class="pg">التقارير</h1><p class="pgsub">أداء عقاراتك وعملائك${me.account_type === 'office' ? ' وفريقك' : ''}.</p>
        <div class="kpis"><div class="kpi"><b>${recent.length}</b><span>عميل في آخر 30 يومًا</span></div><div class="kpi"><b>${closed ? Math.round(won / closed * 100) : 0}%</b><span>نسبة الإغلاق</span></div>
          <div class="kpi"><b>${ps.reduce((x, y) => x + Number(y.views_30d || 0), 0).toLocaleString('en-US')}</b><span>مشاهدة (30 يومًا)</span></div><div class="kpi"><b>${(a.data || []).length}</b><span>نشاط تواصل (30 يومًا)</span></div></div>
        <div class="panel"><h2>العملاء الجدد آخر 14 يومًا</h2><div style="display:flex;align-items:flex-end;gap:4px;height:120px">${days.map(([d, n]) => `<div style="flex:1;text-align:center;font-size:11px;color:var(--muted)"><div title="${n}" style="height:${Math.round(n / maxD * 90)}px;background:var(--teal);border-radius:6px 6px 0 0;min-height:2px"></div>${d}</div>`).join('')}</div></div>
        <div class="gridf"><div class="panel"><h2>العملاء حسب المرحلة</h2>${bars(byStage, leads.length)}</div><div class="panel"><h2>مصادر العملاء</h2>${bars(bySrc, leads.length)}</div></div>
        <div class="gridf"><div class="panel"><h2>نشاط التواصل (30 يومًا)</h2>${bars(acts, (a.data || []).length)}</div>
        <div class="panel"><h2>الأكثر مشاهدة من عقاراتك</h2>${topViews.map((x) => `<div class="bar"><span class="lb" style="width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(titles[x.property_id] || '#' + x.property_id)}</span><span class="tr"><i style="width:${topViews[0].views_30d ? Math.round(x.views_30d / topViews[0].views_30d * 100) : 0}%"></i></span><span class="vl">${x.views_30d}</span></div>`).join('') || '<p class="mut">لا بيانات بعد.</p>'}</div></div>
        ${me.account_type === 'office' ? `<div class="panel"><h2>أداء الفريق</h2><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:14px"><tr style="color:var(--muted);text-align:right"><th>الوسيط</th><th>العملاء</th><th>تم التواصل</th><th>صفقات</th><th>نسبة الإغلاق</th></tr>
          ${[{ id: user.id, full_name: 'أنا (المكتب)' }, ...team].map((t) => { const l = leads.filter((x) => x.broker_id === t.id || x.assigned_to === t.id); const w = l.filter((x) => x.stage === 'won').length, c = l.filter((x) => ['won', 'lost'].includes(x.stage)).length; return `<tr style="border-top:1px solid var(--line)"><td style="padding:8px 4px">${esc(t.full_name)}</td><td>${l.length}</td><td>${l.filter((x) => (x.stage || 'new') !== 'new').length}</td><td>${w}</td><td>${c ? Math.round(w / c * 100) : 0}%</td></tr>`; }).join('')}</table></div></div>` : ''}
        <button class="btn btn-ghost" onclick="window.print()"><i class="fas fa-print"></i> طباعة أو حفظ PDF</button>`;
    }

    // ===================== ملفي =====================
    async function renderProfile() {
      const m = $('main');
      const inv = await sb.from('office_invites').select('id,office_id,status,created_at').eq('status', 'pending');
      const invites = (inv.data || []).filter((i) => i.office_id !== user.id);
      let offices = {};
      if (invites.length) { const r = await sb.from('profiles').select('id,company_name,full_name').in('id', invites.map((i) => i.office_id)); (r.data || []).forEach((o) => { offices[o.id] = o.company_name || o.full_name; }); }
      let myOffice = '';
      if (me.office_id) { const r = await sb.from('profiles').select('company_name,full_name').eq('id', me.office_id).maybeSingle(); myOffice = r.data ? (r.data.company_name || r.data.full_name) : ''; }
      m.innerHTML = `<h1 class="pg">ملفي</h1><p class="pgsub">بياناتك المهنية التي تظهر على إعلاناتك وملفك العام.</p>
        ${invites.map((i) => `<div class="banner ok"><i class="fas fa-envelope-open-text"></i><div style="flex:1">دعاك «${esc(offices[i.office_id] || 'مكتب')}» للانضمام إلى فريقه.<div class="quick"><button class="btn btn-teal sm" data-acc="${i.id}">قبول</button><button class="btn btn-ghost sm" data-dec="${i.id}">رفض</button></div></div></div>`).join('')}
        ${myOffice ? `<div class="banner ok"><i class="fas fa-building-user"></i><div>أنت عضو في فريق «${esc(myOffice)}».</div></div>` : ''}
        <div class="panel"><form id="prF">
          <div class="gridf"><div class="fg"><label>الاسم الكامل</label><input id="fN" value="${esc(me.full_name || '')}"></div>
          ${me.account_type !== 'broker' ? `<div class="fg"><label>${me.account_type === 'office' ? 'اسم المكتب' : 'اسم الشركة'}</label><input id="fCo" value="${esc(me.company_name || '')}"></div>` : `<div class="fg"><label>الجهة التي تعمل بها (اختياري)</label><input id="fAg" value="${esc(me.agency || '')}"></div>`}
          <div class="fg"><label>الجوال</label><input id="fP" dir="ltr" value="${esc(me.phone || '')}"></div><div class="fg"><label>واتساب</label><input id="fW" dir="ltr" value="${esc(me.whatsapp || '')}"></div>
          <div class="fg"><label>رقم الترخيص</label><input id="fL" dir="ltr" value="${esc(me.license_no || '')}"></div><div class="fg"><label>الموقع الإلكتروني</label><input id="fWeb" dir="ltr" value="${esc(me.website || '')}"></div></div>
          <div class="fg"><label>نبذة</label><textarea id="fB">${esc(me.bio || '')}</textarea></div>
          <div class="fg"><label>الشعار أو الصورة</label>${me.logo_url || me.avatar_url ? `<img src="${esc(me.logo_url || me.avatar_url)}" style="width:64px;height:64px;border-radius:12px;object-fit:cover;display:block;margin-bottom:6px">` : ''}<input type="file" id="fLogo" accept="image/*"></div>
          <label class="chk"><input type="checkbox" id="fOpt" ${me.email_opt_out ? '' : 'checked'}> أرغب باستلام رسائل أنا عقار البريدية (عروض وأخبار للمهنيين)</label>
          <p class="mut">نوع الحساب: ${TYPES[me.account_type][0]} · ${me.verified ? '<b style="color:var(--teal)">موثّق</b>' : 'قيد التوثيق'}</p>
          <button class="btn btn-teal">حفظ</button></form></div>`;
      m.querySelectorAll('[data-acc],[data-dec]').forEach((b) => b.onclick = async () => { const { error } = await sb.rpc('respond_office_invite', { p_invite: b.dataset.acc || b.dataset.dec, p_accept: !!b.dataset.acc }); if (error) return toast(setupErr(error), true); toast(b.dataset.acc ? 'انضممت إلى الفريق' : 'رُفضت الدعوة'); boot(); });
      $('prF').onsubmit = async (e) => {
        e.preventDefault();
        const v = { full_name: $('fN').value.trim(), phone: $('fP').value.trim(), whatsapp: $('fW').value.trim(), license_no: $('fL').value.trim() || null, website: $('fWeb').value.trim() || null, bio: $('fB').value.trim() || null, email_opt_out: !$('fOpt').checked };
        if ($('fCo')) v.company_name = $('fCo').value.trim() || null; if ($('fAg')) v.agency = $('fAg').value.trim() || null;
        try { if ($('fLogo').files[0]) { const u = await upload($('fLogo').files[0], 'logo'); v.logo_url = u; v.avatar_url = u; } } catch (er) { toast('تعذّر رفع الصورة', true); }
        const { error } = await sb.from('profiles').update(v).eq('id', user.id);
        if (error) return toast(setupErr(error), true);
        Object.assign(me, v); toast('حُفظ ملفك');
      };
    }

    boot();
  })();
  </script>
  <script src="js/aq-engage.js?v=84" defer></script>
  <script src="js/aq-back.js?v=84" defer></script>
</body>
