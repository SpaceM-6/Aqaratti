<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ملف المطوّر العقاري | AnaAqar</title>

  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" type="image/png" sizes="192x192" href="icons/anaaqar-logo-v5-192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js?v=118"></script>

  <style>
    :root {
      --primary-turquoise: #00857a;
      --turquoise-light: #e6f7f5;
      --dubizzle-navy: #192038;
      --dubizzle-bg: #f4f6f9;
      --dubizzle-border: #e2e8f0;
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Tajawal', sans-serif; background: var(--dubizzle-bg); color: var(--text-dark); line-height: 1.6; }

    .navbar {
      background: #ffffff;
      padding: 14px 30px;
      border-bottom: 1px solid var(--dubizzle-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky; top: 0; z-index: 100;
    }
    .brand-logo { font-size: 20px; font-weight: 900; color: var(--primary-turquoise); text-decoration: none; }
    .nav-back-link { text-decoration: none; font-weight: 800; color: var(--primary-turquoise); font-size: 13px; }

    .back-bar { max-width: 700px; margin: 20px auto 0; padding: 0 20px; }
    .back-to-directory {
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none;
      color: var(--primary-turquoise);
      font-weight: 900;
      font-size: 14px;
      background: white;
      border: 1px solid var(--dubizzle-border);
      padding: 10px 18px;
      border-radius: 10px;
    }
    .back-to-directory:hover { background: var(--turquoise-light); }

    .profile-wrap { max-width: 700px; margin: 18px auto 40px; padding: 0 20px; }

    .dld-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #dcfce7; color: #15803d;
      border: 1px solid #86efac;
      border-radius: 100px;
      padding: 8px 16px;
      font-size: 12.5px; font-weight: 900;
      margin-bottom: 14px;
    }
    .dld-badge i { color: #16a34a; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 900;
      padding: 5px 12px; border-radius: 100px;
      margin-inline-start: 8px;
      vertical-align: middle;
    }
    .status-pill.off { background: #fee2e2; color: #b91c1c; }
    .status-pill.on { background: #dcfce7; color: #15803d; }

    .profile-card {
      background: white;
      border: 1px solid var(--dubizzle-border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    .profile-header {
      background: linear-gradient(135deg, var(--dubizzle-navy), #0f172a);
      color: white;
      padding: 34px 30px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .profile-logo {
      width: 76px; height: 76px;
      border-radius: 16px;
      object-fit: contain;   /* الشعار يظهر كاملًا دون قصّ أو تمطيط */
      padding: 6px;
      border: 3px solid rgba(255,255,255,0.25);
      background: #ffffff;
      flex-shrink: 0;
      cursor: zoom-in;
    }
    .profile-header-names { flex: 1; min-width: 200px; }
    .profile-name-ar { font-size: 21px; font-weight: 900; margin-bottom: 6px; }
    .profile-name-en { font-size: 13px; color: #cbd5e1; font-weight: 700; }

    .profile-body { padding: 28px 30px; }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .info-item {
      background: #f8fafc;
      border: 1px solid var(--dubizzle-border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .info-item .info-label {
      font-size: 11.5px; font-weight: 800; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px; margin-bottom: 6px;
    }
    .info-item .info-label i { color: var(--primary-turquoise); width: 14px; text-align: center; }
    .info-item .info-value { font-size: 14.5px; font-weight: 800; color: var(--dubizzle-navy); word-break: break-word; }
    .info-item .info-value a { color: var(--primary-turquoise); text-decoration: none; }
    .info-item .info-value a:hover { text-decoration: underline; }

    .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .action-buttons a {
      flex: 1;
      min-width: 140px;
      text-align: center;
      font-size: 13.5px; font-weight: 900;
      padding: 12px; border-radius: 10px;
      text-decoration: none;
      color: white;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .act-call { background: var(--dubizzle-navy); }
    .act-whatsapp { background: #16a34a; }
    .act-email { background: #475569; }

    .not-found {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-weight: 700;
    }
    .not-found i { font-size: 40px; display: block; margin-bottom: 14px; color: var(--dubizzle-border); }

    @media (max-width: 600px) {
      .profile-header { text-align: center; justify-content: center; }
      .profile-header-names { text-align: center; }
    }
  </style>
  <link rel="stylesheet" href="css/aq-polish.css?v=118">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand-logo aq-brand"><img src="icons/logo.svg" alt="" width="98" height="30"><span>أنا عقار</span></a>
    <a href="index.html" class="nav-back-link"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
  </nav>

  <div class="back-bar">
    <a href="brokers-directory.html" class="back-to-directory"><i class="fas fa-arrow-right"></i> العودة إلى الدليل</a>
  </div>

  <div class="profile-wrap" id="profileWrap">
    <!-- يُعبَّأ ديناميكياً عبر JavaScript -->
  </div>

  <script src="js/image-lightbox.js"></script>
  <script>
    function waNumber(phone) { return (phone || '').replace(/\D/g, ''); }

    function renderNotFound() {
      document.getElementById('profileWrap').innerHTML = `
        <div class="profile-card">
          <div class="not-found">
            <i class="fas fa-city"></i>
            لم يتم العثور على بيانات هذا المطوّر.
          </div>
        </div>
      `;
    }

    function renderLoading() {
      document.getElementById('profileWrap').innerHTML = `
        <div class="profile-card">
          <div class="not-found"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
        </div>
      `;
    }

    function renderProfile(d) {
      const isActive = !!d.is_active;
      const phone = d.phone || d.mobile;

      document.getElementById('profileWrap').innerHTML = `
        <div class="dld-badge"><i class="fas fa-circle-check"></i> معتمد لدى دائرة الأراضي والأملاك في دبي</div>
        <span class="status-pill ${isActive ? 'on' : 'off'}">${isActive ? 'مفعل' : 'غير مفعل'}</span>

        <div class="profile-card">
          <div class="profile-header">
            <img class="profile-logo lightbox-img" src="${d.logo_url || 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=200'}" alt="${d.name_ar || ''}" loading="lazy">
            <div class="profile-header-names">
              <div class="profile-name-ar">${d.name_ar || '-'}</div>
              <div class="profile-name-en">${d.name_en || ''}</div>
            </div>
          </div>

          <div class="profile-body">
            <div class="info-grid">
              <div class="info-item">
                <div class="info-label"><i class="fas fa-id-card"></i> رقم المطوّر (DLD)</div>
                <div class="info-value">${d.dld_developer_number}</div>
              </div>

              ${d.rating ? `
              <div class="info-item">
                <div class="info-label"><i class="fas fa-star"></i> التقييم</div>
                <div class="info-value">${d.rating} <i class="fas fa-star" style="color:#d4af37;"></i></div>
              </div>` : ''}

              ${phone ? `
              <div class="info-item">
                <div class="info-label"><i class="fas fa-phone-alt"></i> الهاتف</div>
                <div class="info-value"><a href="tel:${phone}">${phone}</a></div>
              </div>` : ''}

              ${d.email ? `
              <div class="info-item">
                <div class="info-label"><i class="fas fa-envelope"></i> البريد الإلكتروني</div>
                <div class="info-value"><a href="mailto:${d.email}">${d.email}</a></div>
              </div>` : ''}
            </div>

            <div class="action-buttons">
              ${!phone && isActive && window.__aqAnon && window.aqUnlockContactHTML ? aqUnlockContactHTML('سجّل الدخول لإظهار رقم المطوّر') : ''}
              ${phone ? `<a href="tel:${phone}" class="act-call"><i class="fas fa-phone-alt"></i> اتصال</a>` : ''}
              ${phone ? `<a href="https://wa.me/${waNumber(phone)}" target="_blank" rel="noopener noreferrer" class="act-whatsapp"><i class="fab fa-whatsapp"></i> واتساب</a>` : ''}
              ${d.email ? `<a href="mailto:${d.email}" class="act-email"><i class="fas fa-envelope"></i> إرسال بريد</a>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const id = Number(new URLSearchParams(window.location.search).get('id'));
      if (!id) {
        renderNotFound();
        return;
      }

      renderLoading();

      const { data: developer, error } = await supabaseClient
        .from('developers')
        .select((window.aqIsSignedIn && !(await aqIsSignedIn())) ? 'id,dld_developer_number,name_ar,name_en,logo_url,rating,is_active,activated_at,country,source,created_at' : '*')
        .eq('id', id)
        .single();

      if (error || !developer) {
        renderNotFound();
        return;
      }

      document.title = `${developer.name_ar || 'مطوّر عقاري'} | AnaAqar`;
      renderProfile(developer);
      // مشاريع المطوّر المسجلة لدى دائرة الأراضي والأملاك
      try {
        const pr = await supabaseClient.from('dld_projects').select('name_en,area_en,status,percent_completed,end_date,cnt_unit').eq('developer_number', developer.dld_developer_number).order('cnt_unit', { ascending: false }).limit(60);
        const list = pr.data || [], T = (s) => window.AQAreas ? AQAreas.title(s) : (s || '');
        const E = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const ST = { ACTIVE: 'قيد الإنشاء', FINISHED: 'مكتمل', PENDING: 'لم يبدأ بعد', 'NOT STARTED': 'لم يبدأ بعد', CANCELLED: 'ملغى', CONDITIONAL_ACTIVATING: 'قيد التفعيل' };
        const box = document.createElement('div'); box.className = 'profile-card'; box.style.marginTop = '16px';
        box.innerHTML = `<div style="padding:18px"><h2 style="margin:0 0 4px;font-size:19px;font-weight:900">مشاريع المطوّر المسجلة لدى الدائرة <span style="color:#64748b;font-size:14px">(${list.length})</span></h2>
          <p style="margin:0 0 12px;color:#64748b;font-size:13px;font-weight:600">المطوّر لا يعمل بوسطاء خاصين به في سجل الدائرة؛ وهذه مشاريعه المسجلة رسميًا.</p>` +
          (list.length ? `<div style="display:grid;gap:8px">${list.map((p) => `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px"><b style="font-size:15px">${E(T(p.name_en))}</b>
            <div style="color:#64748b;font-size:12.5px;font-weight:700;margin-top:3px">${E(T(p.area_en))} · ${E(ST[p.status] || p.status || '')} · الإنجاز ${Number(p.percent_completed) || 0}%${p.end_date ? ' · التسليم ' + E(String(p.end_date).slice(0, 7)) : ''}${p.cnt_unit ? ' · ' + Number(p.cnt_unit).toLocaleString('en-US') + ' وحدة' : ''}</div></div>`).join('')}</div>`
          : '<p style="margin:0;color:#64748b;font-weight:700">لا توجد مشاريع مسجلة لهذا المطوّر في البيانات المفتوحة حاليًا.</p>') + '</div>';
        document.getElementById('profileWrap').after(box);
      } catch (e) {}
    });
  </script>

  <script src="js/aq-ads.js?v=118" defer></script>
  <script src="js/aq-back.js?v=118" defer></script>
</body>
</html>
