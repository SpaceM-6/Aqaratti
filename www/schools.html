<head>

  <script>try { if (localStorage.getItem('anaaqar_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    .tools { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; margin:0 0 12px; } @media (max-width:700px) { .tools { grid-template-columns:1fr 1fr; } .tools input { grid-column:1/-1; } }
    .tools input, .tools select { min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:10px 12px; font:700 15px 'Tajawal', sans-serif; background:var(--card); color:var(--ink); }
    .kpis { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin:0 0 14px; } @media (max-width:700px) { .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    .kpi { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; } .kpi b { display:block; font-size:20px; font-weight:900; color:#0f766e; } .kpi small { color:var(--muted); font-weight:700; font-size:12.5px; }
    [data-theme="dark"] .kpi b { color:#5eead4; }
    .list { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px; } @media (max-width:700px) { .list { grid-template-columns:minmax(0, 1fr); } }
    .it { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px 14px; min-width:0; }
    .it .t { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; } .it b { font-size:16px; line-height:1.5; } .it small { display:block; color:var(--muted); font-weight:700; font-size:13px; line-height:1.8; }
    .pill { flex:0 0 auto; border-radius:999px; padding:2px 10px; font-size:12px; font-weight:900; }
    .lk { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; } .lk a { font-weight:800; font-size:13.5px; color:var(--teal-dark, #0f766e); text-decoration:none; }
    .empty { text-align:center; padding:26px 16px; background:var(--card); border:1px solid var(--line); border-radius:18px; color:var(--muted); font-weight:700; line-height:1.9; }
    .src { color:var(--muted); font-size:12px; font-weight:600; margin:12px 0 0; } .more { text-align:center; margin:12px 0; }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-in"><a class="brand" href="index.html"><img src="icons/logo.svg" alt="" width="98" height="30"><b>أنا عقار</b></a><a class="back" href="area/">دليل المناطق ←</a></div></header>
  <section class="head"><div class="head-in"><h1><i class="fas fa-school"></i> دليل المدارس في دبي</h1><p>المدارس الخاصة بتقييم هيئة المعرفة والتنمية البشرية، ومنهجها ومنطقتها، لتختار سكنك قريبًا من مدرسة أولادك.</p></div></section>
  <main>
    <div class="tools"><input id="q" type="search" placeholder="ابحث باسم المدرسة أو المنطقة" autocomplete="off"><select id="cur"><option value="">كل المناهج</option></select><select id="rat"><option value="">كل التقييمات</option></select></div>
    <div class="kpis" id="k"></div>
    <div id="out" class="list"></div><div class="more" id="more"></div>
    <p class="src">المصدر: البيانات المفتوحة لهيئة المعرفة والتنمية البشرية في دبي (KHDA) عبر منصة دبي للبيانات. تأكد من الرسوم والقبول من المدرسة مباشرة.</p>
  </main>
  <script>
    (async () => {
      const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const RAT = { 'outstanding': ['متميز', '#dcfce7', '#15803d', 1], 'very good': ['جيد جدًا', '#e0f2fe', '#0369a1', 2], 'good': ['جيد', '#fef9c3', '#a16207', 3], 'acceptable': ['مقبول', '#ffedd5', '#c2410c', 4], 'weak': ['ضعيف', '#fee2e2', '#b91c1c', 5], 'very weak': ['ضعيف جدًا', '#fee2e2', '#b91c1c', 6] };
      const rk = (s) => RAT[String(s.rating_en || '').trim().toLowerCase()];
      const out = document.getElementById('out');
      let all = [];
      try { for (let off = 0; off < 5000; off += 1000) { const r = await supabaseClient.from('schools').select('*').range(off, off + 999); if (r.error) break; all = all.concat(r.data || []); if ((r.data || []).length < 1000) break; } } catch (e) {}
      if (!all.length) { out.outerHTML = '<div class="empty"><i class="fas fa-school" style="font-size:30px;color:#0f766e"></i><br>نجهّز دليل المدارس الآن من بيانات هيئة المعرفة الرسمية، ويظهر هنا قريبًا.<br><a class="btn btn-teal" href="area/" style="margin-top:10px;display:inline-flex">تصفّح أسعار المناطق</a></div>'; return; }
      const cur = [...new Set(all.map((s) => s.curriculum_en).filter(Boolean))].sort();
      document.getElementById('cur').innerHTML += cur.map((c) => `<option>${esc(c)}</option>`).join('');
      document.getElementById('rat').innerHTML += Object.entries(RAT).filter(([k]) => all.some((s) => String(s.rating_en || '').toLowerCase() === k)).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('');
      const qs = new URLSearchParams(location.search); if (qs.get('area')) document.getElementById('q').value = qs.get('area');
      let shown = 40;
      const draw = () => {
        const q = document.getElementById('q').value.trim().toLowerCase(), c = document.getElementById('cur').value, r = document.getElementById('rat').value;
        const L = all.filter((s) => (!c || s.curriculum_en === c) && (!r || String(s.rating_en || '').toLowerCase() === r) && (!q || [s.name_en, s.name_ar, s.area_en, s.area_ar].join(' ').toLowerCase().includes(q)))
          .sort((a, b) => ((rk(a) || [, , , 9])[3] - (rk(b) || [, , , 9])[3]) || (b.students || 0) - (a.students || 0));
        const top = L.filter((s) => (rk(s) || [])[3] <= 2).length;
        document.getElementById('k').innerHTML = `<div class="kpi"><b>${L.length}</b><small>مدرسة</small></div><div class="kpi"><b>${top}</b><small>متميز أو جيد جدًا</small></div><div class="kpi"><b>${new Set(L.map((s) => s.curriculum_en)).size}</b><small>منهج</small></div><div class="kpi"><b>${L.reduce((t, s) => t + (s.students || 0), 0).toLocaleString('en-US')}</b><small>طالب</small></div>`;
        out.innerHTML = L.slice(0, shown).map((s) => { const x = rk(s); return `<div class="it"><div class="t"><b>${esc(s.name_ar || s.name_en)}</b>${x ? `<span class="pill" style="background:${x[1]};color:${x[2]}">${x[0]}</span>` : ''}</div>
          <small>${s.name_ar && s.name_en ? esc(s.name_en) + '<br>' : ''}${esc(s.curriculum_ar || s.curriculum_en || '')} · ${esc(s.area_ar || s.area_en || '')}${s.students ? ' · ' + s.students.toLocaleString('en-US') + ' طالب' : ''}${s.inspection_year ? ' · تقييم ' + esc(s.inspection_year) : ''}</small>
          <div class="lk">${s.lat && s.lng ? `<a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener"><i class="fas fa-location-dot"></i> الموقع</a>` : ''}${s.website ? `<a href="${esc(/^https?:/.test(s.website) ? s.website : 'https://' + s.website)}" target="_blank" rel="noopener nofollow">الموقع الإلكتروني</a>` : ''}${s.telephone ? `<a href="tel:${esc(s.telephone)}" dir="ltr">${esc(s.telephone)}</a>` : ''}${s.report_url ? `<a href="${esc(s.report_url)}" target="_blank" rel="noopener">تقرير التفتيش</a>` : ''}<a href="listings.html?q=${encodeURIComponent(s.area_ar || s.area_en || '')}">عقارات قريبة</a></div></div>`; }).join('') || '<div class="empty" style="grid-column:1/-1">لا مدارس تطابق البحث. جرّب كلمة أخرى.</div>';
        document.getElementById('more').innerHTML = L.length > shown ? `<button class="btn btn-soft" id="mb">عرض المزيد (${L.length - shown})</button>` : '';
        const mb = document.getElementById('mb'); if (mb) mb.onclick = () => { shown += 40; draw(); };
      };
      ['q', 'cur', 'rat'].forEach((id) => document.getElementById(id).addEventListener(id === 'q' ? 'input' : 'change', () => { shown = 40; draw(); }));
      draw();
    })();
  </script>
  <script src="js/aq-engage.js?v=110" defer></script>
  <script src="js/aq-back.js?v=110" defer></script>
  <script src="js/aq-ads.js?v=110" defer></script>
</body>
</html>
