<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز الوسطاء والمكاتب والمطوّرين | أنا عقار AnaAqar</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="icons/app-icon-v3-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a896">
  <script>try { if (localStorage.getItem('anaaqar_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aq-pages.css?v=86">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js?v=86"></script>
  <style>
    .vb { display:flex; align-items:center; gap:16px; padding:18px; border-radius:18px; background:linear-gradient(135deg,#eff6ff,#e6f7f5); border:1px solid #dbeafe; margin:0 0 18px; }
    [data-theme="dark"] .vb { background:linear-gradient(135deg,#13254a,#0f2e33); border-color:#24365e; }
    .vb .ic { flex:0 0 auto; width:62px; height:62px; border-radius:50%; display:grid; place-items:center; background:#2563eb; color:#fff; font-size:28px; box-shadow:0 0 0 8px rgba(37,99,235,.12); }
    .vb.ok .ic { background:#16a34a; box-shadow:0 0 0 8px rgba(22,163,74,.12); }
    .vb b { display:block; font-size:19px; font-weight:900; } .vb small { display:block; color:var(--muted); font-size:14.5px; font-weight:600; }
    .steps { counter-reset:s; display:grid; gap:10px; margin:0 0 18px; }
    .steps div { counter-increment:s; display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
    .steps div:before { content:counter(s); flex:0 0 auto; width:30px; height:30px; border-radius:50%; background:var(--teal); color:#fff; display:grid; place-items:center; font-weight:900; }
    .steps div.done:before { content:"✓"; background:#16a34a; }
    .tiles { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; }
    @media (max-width:760px) { .tiles { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    .tiles a { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; text-decoration:none; color:var(--ink); display:flex; flex-direction:column; gap:4px; min-width:0; }
    .tiles a i { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--teal-soft); color:var(--teal-dark); font-size:18px; margin-bottom:4px; }
    .tiles b { font-size:15.5px; } .tiles small { color:var(--muted); font-weight:600; font-size:13px; }
    h2.t { font-size:19px; margin:22px 0 10px; }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-in">
    <a class="brand" href="index.html"><img src="icons/logo.svg" alt="" width="98" height="30"><b>أنا عقار</b></a>
    <a class="back" href="index.html">الرئيسية ←</a>
  </div></header>
  <section class="head"><div class="head-in"><h1><i class="fas fa-user-tie"></i> مركز الوسطاء والمكاتب والمطوّرين</h1><p>كل ما يخص انضمامك وتوثيق حسابك وإعلاناتك في مكان واحد.</p></div></section>
  <main id="root"><div class="skel"></div></main>
  <script>
  (function () {
    const sb = supabaseClient, $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const TYPES = { broker: 'وسيط عقاري', office: 'مكتب عقاري', developer: 'مطوّر عقاري' };
    const tile = (href, ic, b, s) => `<a href="${href}"><i class="fas ${ic}"></i><b>${b}</b><small>${s}</small></a>`;

    // لغير المهنيين: دعوة للانضمام فقط
    function joinView(signedIn) {
      $('root').innerHTML = `<div class="empty"><i class="fas fa-user-tie"></i><h2>هذه الصفحة للوسطاء والمكاتب والمطوّرين</h2>
        <p>${signedIn ? 'حسابك الحالي حساب زائر. فعّل حسابًا مهنيًا لتفتح لك أدوات النشر والتوثيق.' : 'سجّل الدخول بحسابك المهني، أو أنشئ حسابًا كوسيط أو مكتب أو مطوّر.'}</p>
        <div class="acts" style="justify-content:center"><a class="btn btn-teal" href="pro.html">${signedIn ? 'فعّل حسابي المهني' : 'دخول / تسجيل حساب مهني'}</a><a class="btn btn-ghost" href="claim-profile.html">ملفي موجود في دليل الوسطاء</a></div></div>`;
    }

    function proView(me, admin) {
      const t = me.account_type, verified = !!me.verified || admin, hasLic = !!me.license_no;
      $('root').innerHTML = `
        ${verified ? `<div class="vb ok"><span class="ic"><i class="fas fa-circle-check"></i></span><div><b>حسابك موثّق ✅</b><small>تظهر علامة «موثّق» على ملفك وإعلاناتك، وتصلك بيانات تواصل المشترين في «طلبات المشترين».</small></div></div>`
        : `<a class="vb" href="pro.html#profile" style="text-decoration:none;color:inherit"><span class="ic"><i class="fas fa-certificate"></i></span><div><b>هل حصلت على شارة التوثيق؟</b><small>ظهور أكثر لإعلاناتك، وثقة أعلى عند العملاء، وتظهر لك بيانات تواصل المشترين.</small></div><i class="fas fa-arrow-left" style="margin-inline-start:auto;color:#2563eb;font-size:20px"></i></a>
          <h2 class="t">خطوات التوثيق</h2>
          <div class="steps"><div class="done"><span><b>أنشئ حسابك المهني</b><br><small class="hint">${esc(TYPES[t] || '')}${me.company_name ? ' — ' + esc(me.company_name) : ''}</small></span></div>
          <div class="${hasLic ? 'done' : ''}"><span><b>أضف رقم الترخيص</b><br><small class="hint">${hasLic ? 'رقمك: ' + esc(me.license_no) : `رقم BRN للوسيط أو ORN للمكتب أو الرخصة التجارية للمطوّر — من <a href="pro.html#profile">«ملفي»</a>`}</small></span></div>
          <div><span><b>مراجعة فريق أنا عقار</b><br><small class="hint">نتحقق من الرقم في سجل دائرة الأراضي والأملاك، ثم تظهر علامة «موثّق».</small></span></div></div>`}
        <h2 class="t">أضف إعلانك</h2>
        <div class="tiles">${tile('add-property.html', 'fa-building', 'عقار للبيع أو الإيجار', 'سكني أو تجاري')}${tile('add-property.html?stay=1', 'fa-umbrella-beach', 'وحدة شورت تيرم', 'حجز يومي وشهري')}${t === 'developer' || admin ? tile('pro.html#projects', 'fa-city', 'مشروع على الخارطة', 'خطة السداد وأنواع الوحدات') : ''}${tile('add-car.html', 'fa-car-side', 'إعلان موتورات', 'سيارات ودراجات ويخوت')}</div>
        <h2 class="t">إدارة أعمالك</h2>
        <div class="tiles">${tile('pro.html#home', 'fa-gauge', 'لوحتي', 'ملخص نشاطك')}${tile('pro.html#leads', 'fa-address-book', 'العملاء', 'استفسارات المشترين ومراحلها')}${tile('pro.html#listings', 'fa-building', 'عقاراتي', 'تعديل وإيقاف وبيع')}${tile('pro.html#bookings', 'fa-calendar-check', 'الحجوزات', 'حجوزات وحداتك الشورت تيرم')}${tile('pro.html#requests', 'fa-magnifying-glass-location', 'طلبات المشترين', 'من يبحث عن عقار مثل عقارك')}${t === 'office' ? tile('pro.html#team', 'fa-people-group', 'فريقي', 'دعوة الوسطاء وأداؤهم') : ''}${tile('pro.html#reports', 'fa-chart-pie', 'التقارير', 'المشاهدات والصفقات')}${tile('pro.html#profile', 'fa-id-card', 'ملفي', 'البيانات ورقم الترخيص')}</div>
        <h2 class="t">ظهورك في الأدلة</h2>
        <div class="tiles">${tile('claim-profile.html', 'fa-user-check', 'فعّل ملفك في دليل الوسطاء', 'إن كان اسمك مسجّلًا لدى دائرة الأراضي')}${tile('broker-registration.html', 'fa-building-user', 'سجّل مكتبك في الدليل', 'للمكاتب والشركات')}${tile('brokers-directory.html', 'fa-address-card', 'دليل الوسطاء', 'كيف يراك العملاء')}</div>
        ${admin ? `<h2 class="t">الإدارة</h2><div class="tiles">${tile('admin/index.html', 'fa-shield-halved', 'لوحة التحكم', 'المراجعة والتوثيق')}${tile('admin/index.html#s-accounts', 'fa-id-card', 'توثيق الحسابات', 'الحسابات المهنية بانتظار التوثيق')}</div>` : ''}`;
    }

    (async () => {
      const { data } = await sb.auth.getSession();
      const user = data && data.session && data.session.user;
      if (!user) return joinView(false);
      const [p, a] = await Promise.all([sb.from('profiles').select('*').eq('id', user.id).maybeSingle(), sb.rpc('is_app_admin')]);
      const me = p.data || {}, admin = a.data === true;
      if (!admin && !['broker', 'office', 'developer'].includes(me.account_type)) return joinView(true);
      proView(me, admin);
    })();
  })();
  </script>
  <script src="js/aq-engage.js?v=86" defer></script>
  <script src="js/aq-back.js?v=86" defer></script>
</body>
</html>
