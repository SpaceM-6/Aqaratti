<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سيارات للبيع والإيجار | أنا عقار AnaAqar</title>
  <meta name="description" content="سيارات جديدة ومستعملة للبيع، وسيارات للإيجار اليومي والأسبوعي والشهري في الإمارات من أصحابها والمعارض وشركات التأجير.">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" href="icons/app-icon-v3-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00a896">
  <script>try { if (localStorage.getItem('anaaqar_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/aq-pages.css?v=84">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="supabase-client.js?v=84"></script>
  <script src="js/aq-cars.js?v=84"></script>
  <script src="js/aq-stay.js?v=84"></script>
  <script src="js/aq-ads.js?v=84"></script>
  <style>
    .bar { position:sticky; top:57px; z-index:15; background:var(--bg); padding:10px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .bar input, .bar select { border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:10px 12px; font:inherit; font-weight:700; font-size:14.5px; min-height:44px; }
    .bar .q { flex:1 1 220px; min-width:0; }
    .bar .pr { display:flex; gap:6px; align-items:center; background:var(--card); border:1.5px solid var(--line); border-radius:12px; padding:0 8px; }
    .bar .pr input { width:92px; border:0; padding:8px 2px; min-height:40px; }
    @media (max-width:760px) { .bar { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin:0 -16px; padding:10px 16px; } .bar::-webkit-scrollbar { display:none; } .bar > * { flex:0 0 auto; } .bar .q { flex:0 0 200px; } }
    .fb { display:inline-flex; align-items:center; gap:6px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:9px 14px; font:inherit; font-weight:800; cursor:pointer; min-height:44px; }
    .fb .bdg { background:#0f172a; color:#fff; border-radius:999px; min-width:20px; height:20px; display:inline-grid; place-items:center; font-size:12px; }
    .bodies { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; margin:4px 0 6px; }
    .bodies::-webkit-scrollbar { display:none; }
    .bodies button { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:84px; border:1.5px solid var(--line); background:var(--card); color:var(--muted); border-radius:14px; padding:10px 8px 8px; font:inherit; font-weight:800; font-size:13px; cursor:pointer; }
    .bodies button i { font-size:19px; } .bodies button.on { border-color:var(--ink); color:var(--ink); box-shadow:0 0 0 1px var(--ink) inset; }
    .fs-sec { padding:14px 0; border-bottom:1px solid var(--line); } .fs-sec h4 { margin:0 0 10px; font-size:17px; font-weight:900; }
    .fs-chips { display:flex; gap:8px; flex-wrap:wrap; }
    .fs-chip { border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 13px; font:inherit; font-weight:700; font-size:14.5px; cursor:pointer; }
    .fs-chip.on { border-color:var(--ink); background:var(--ink); color:var(--card); }
    .fs-in { width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font:inherit; font-size:15px; background:var(--card); color:var(--ink); }
    .cnt { color:var(--muted); font-weight:800; font-size:14px; margin:4px 0 12px; }
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-in">
    <a class="brand" href="index.html"><img src="icons/logo.svg" alt="" width="98" height="30"><b>أنا عقار</b></a>
    <a class="back" href="index.html">الرئيسية ←</a>
  </div></header>
  <section class="head"><div class="head-in">
    <h1><i class="fas fa-car-side"></i> سيارات للبيع والإيجار</h1>
    <p>سيارات جديدة ومستعملة للبيع، وسيارات للإيجار باليوم أو الأسبوع أو الشهر من أصحابها والمعارض وشركات التأجير.</p>
  </div></section>
  <main>
    <div class="tabs" id="tabs">
      <button class="tab" data-d="">كل السيارات</button><button class="tab" data-d="sale"><i class="fas fa-key"></i> شراء</button><button class="tab" data-d="rent"><i class="fas fa-calendar-day"></i> إيجار</button>
      <a class="tab" href="add-car.html" style="text-decoration:none;margin-inline-start:auto;background:#e11d48;border-color:#e11d48;color:#fff"><i class="fas fa-plus"></i> أضف سيارتك</a>
    </div>
    <div class="bar">
      <input class="q" id="q" type="search" placeholder="ابحث بالماركة أو الموديل" aria-label="بحث">
      <select id="make" aria-label="الماركة"><option value="">كل الماركات</option></select>
      <span class="pr"><input id="pmin" type="number" inputmode="numeric" placeholder="السعر من" aria-label="السعر من"> – <input id="pmax" type="number" inputmode="numeric" placeholder="إلى" aria-label="السعر إلى"></span>
      <button class="fb" id="fBtn" type="button"><i class="fas fa-sliders" style="color:#e11d48"></i> الفلاتر <span class="bdg" id="fN" hidden></span></button>
      <select id="sort" aria-label="الترتيب"><option value="new">الأحدث</option><option value="price_asc">السعر: الأقل أولًا</option><option value="price_desc">السعر: الأعلى أولًا</option><option value="year">سنة الصنع: الأحدث</option><option value="km">المسافة المقطوعة: الأقل</option></select>
    </div>
    <div class="bodies" id="bodies"></div>
    <div data-aq-ads="cars" data-title="عروض وإعلانات"></div>
    <div class="cnt" id="cnt"></div>
    <div class="grid" id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <div class="acts" style="justify-content:center;margin-top:22px"><a class="btn btn-teal" href="add-car.html"><i class="fas fa-plus"></i> أضف سيارتك للبيع أو الإيجار</a><a class="btn btn-ghost" href="services-directory.html?cat=car_rental"><i class="fas fa-building"></i> دليل شركات تأجير السيارات</a></div>
  </main>
  <script>
  (function () {
    const C = AQCars, { esc } = C, $ = (id) => document.getElementById(id), qs = new URLSearchParams(location.search);
    const st = document.createElement('style'); st.textContent = C.CSS; document.head.appendChild(st);
    const F = { deal: ['sale', 'rent'].includes(qs.get('deal')) ? qs.get('deal') : '', body: qs.get('body') || '', fuel: new Set(), trans: '', specs: new Set(), seller: new Set(), cond: '', period: '', ymin: '', kmax: '', city: '' };
    let pool = [];
    $('make').insertAdjacentHTML('beforeend', C.MAKES.map(([v, l]) => `<option value="${v}">${l}</option>`).join(''));
    if (qs.get('make')) $('make').value = qs.get('make');
    $('bodies').innerHTML = `<button data-b="" class="${F.body ? '' : 'on'}"><i class="fas fa-border-all"></i>الكل</button>` + C.BODY.map(([v, l, ic]) => `<button data-b="${v}" class="${F.body === v ? 'on' : ''}"><i class="fas ${ic}"></i>${l}</button>`).join('');
    $('bodies').onclick = (e) => { const b = e.target.closest('[data-b]'); if (!b) return; F.body = b.dataset.b; $('bodies').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b)); draw(); };
    const syncTabs = () => $('tabs').querySelectorAll('[data-d]').forEach((t) => t.classList.toggle('on', t.dataset.d === F.deal));
    $('tabs').onclick = (e) => { const t = e.target.closest('[data-d]'); if (!t) return; F.deal = t.dataset.d; F.period = ''; syncTabs(); draw(); };
    syncTabs();
    function match(c) {
      const t = (C.name(c) + ' ' + c.make + ' ' + (C.MAKE_AR[c.make] || '') + ' ' + c.model + ' ' + (c.description || '')).toLowerCase(), q = $('q').value.trim().toLowerCase();
      const mn = +$('pmin').value || 0, mx = +$('pmax').value || Infinity;
      return (!F.deal || c.deal === F.deal) && (!q || t.includes(q)) && (!$('make').value || c.make === $('make').value) && c.price >= mn && c.price <= mx &&
        (!F.body || c.body_type === F.body) && (!F.fuel.size || F.fuel.has(c.fuel)) && (!F.trans || c.transmission === F.trans) && (!F.specs.size || F.specs.has(c.regional_specs)) &&
        (!F.seller.size || F.seller.has(c.seller_type)) && (!F.cond || c.condition === F.cond) && (!F.period || c.rent_period === F.period) &&
        (!F.ymin || (c.year || 0) >= +F.ymin) && (!F.kmax || (c.mileage_km || 0) <= +F.kmax) && (!F.city || (c.city || '').includes(F.city));
    }
    const nF = () => F.fuel.size + F.specs.size + F.seller.size + [F.trans, F.cond, F.period, F.ymin, F.kmax, F.city].filter(Boolean).length;
    function draw() {
      const k = $('sort').value, rows = pool.filter(match);
      rows.sort((a, b) => k === 'price_asc' ? a.price - b.price : k === 'price_desc' ? b.price - a.price : k === 'year' ? (b.year || 0) - (a.year || 0) : k === 'km' ? (a.mileage_km || 0) - (b.mileage_km || 0) : (a.demo ? 1 : 0) - (b.demo ? 1 : 0) || String(b.created_at).localeCompare(String(a.created_at)));
      $('cnt').textContent = rows.length ? rows.length + ' سيارة' : '';
      $('list').innerHTML = rows.map(C.card).join('') || `<div class="empty" style="grid-column:1/-1"><i class="fas fa-car-side"></i><h2>لا توجد سيارات مطابقة</h2><p>غيّر الفلاتر، أو أضف سيارتك ليراها المهتمون.</p><a class="btn btn-teal" href="add-car.html">أضف سيارتك</a></div>`;
      const n = nF(); $('fN').hidden = !n; $('fN').textContent = n;
    }
    ['q', 'make', 'pmin', 'pmax', 'sort'].forEach((id) => $(id).addEventListener(id === 'q' ? 'input' : 'change', draw));
    $('fBtn').onclick = () => {
      const chips = (k, list, multi) => `<div class="fs-chips" data-k="${k}">${list.map(([v, l]) => `<button type="button" class="fs-chip ${(multi ? F[k].has(v) : F[k] === v) ? 'on' : ''}" data-v="${v}">${l}</button>`).join('')}</div>`;
      const sh = AQStay.sheet(`<div class="aqs-hd"><h3>الفلاتر</h3><button class="aqs-x" data-x aria-label="إغلاق">✕</button></div><div class="aqs-body">
        ${F.deal !== 'sale' ? `<div class="fs-sec"><h4>مدة الإيجار</h4>${chips('period', [['daily', 'يومي'], ['weekly', 'أسبوعي'], ['monthly', 'شهري']])}</div>` : ''}
        <div class="fs-sec"><h4>الحالة</h4>${chips('cond', [['new', 'جديدة'], ['used', 'مستعملة']])}</div>
        <div class="fs-sec"><h4>نوع الوقود</h4>${chips('fuel', C.FUEL, true)}</div>
        <div class="fs-sec"><h4>ناقل الحركة</h4>${chips('trans', C.TRANS)}</div>
        <div class="fs-sec"><h4>المواصفات</h4>${chips('specs', C.SPECS, true)}</div>
        <div class="fs-sec"><h4>المعلن</h4>${chips('seller', C.SELLER, true)}</div>
        <div class="fs-sec"><h4>سنة الصنع من</h4><input class="fs-in" id="fy" type="number" inputmode="numeric" placeholder="مثال: 2020" value="${esc(F.ymin)}"></div>
        <div class="fs-sec"><h4>أقصى مسافة مقطوعة (كم)</h4><input class="fs-in" id="fk" type="number" inputmode="numeric" placeholder="مثال: 80000" value="${esc(F.kmax)}"></div>
        <div class="fs-sec" style="border:0"><h4>المدينة</h4><input class="fs-in" id="fc" placeholder="مثال: دبي" value="${esc(F.city)}"></div></div>
        <div class="aqs-ft"><button class="clr" type="button" data-r>مسح الكل</button><button class="go" type="button" style="background:#e11d48"></button></div>`);
      const el = sh.el, go = el.querySelector('.go'), upd = () => { go.textContent = `اعرض ${AQStay.resTxt(pool.filter(match).length)}`; };
      el.querySelectorAll('.fs-chips').forEach((box) => box.onclick = (e) => {
        const b = e.target.closest('[data-v]'); if (!b) return; const k = box.dataset.k, v = b.dataset.v;
        if (F[k] instanceof Set) { F[k].has(v) ? F[k].delete(v) : F[k].add(v); b.classList.toggle('on'); } else { F[k] = F[k] === v ? '' : v; box.querySelectorAll('.fs-chip').forEach((x) => x.classList.toggle('on', x === b && !!F[k])); }
        upd();
      });
      [['fy', 'ymin'], ['fk', 'kmax'], ['fc', 'city']].forEach(([i, k]) => el.querySelector('#' + i).oninput = (e) => { F[k] = e.target.value.trim(); upd(); });
      el.querySelector('[data-r]').onclick = () => { F.fuel.clear(); F.specs.clear(); F.seller.clear(); Object.assign(F, { trans: '', cond: '', period: '', ymin: '', kmax: '', city: '' }); el.querySelectorAll('.fs-chip.on').forEach((x) => x.classList.remove('on')); el.querySelectorAll('input').forEach((i) => i.value = ''); upd(); };
      go.onclick = () => { sh.close(); draw(); };
      upd();
    };
    C.load().then((l) => { pool = l; draw(); });
  })();
  </script>
  <script src="js/aq-engage.js?v=84" defer></script>
  <script src="js/aq-back.js?v=84" defer></script>
  <script>document.addEventListener('DOMContentLoaded', () => window.AQAds && AQAds.bottomNav(''));</script>
</body>
</html>
