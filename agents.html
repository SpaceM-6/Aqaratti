  <style>
    .seg { display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:3px; gap:3px; margin:0 0 10px; }
    .seg button { border:0; background:transparent; padding:8px 18px; border-radius:9px; font:800 14.5px 'Tajawal', sans-serif; color:var(--muted); cursor:pointer; }
    .seg button.on { background:#e6f7f5; color:#0f766e; }
    .srch { display:flex; gap:8px; margin:0 0 10px; }
    .srch input { flex:1 1 auto; min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:11px 14px; font:600 15px 'Tajawal', sans-serif; background:var(--card); color:var(--ink); }
    .srch button { border:0; border-radius:12px; padding:0 20px; background:#00857a; color:#fff; font:900 15px 'Tajawal', sans-serif; cursor:pointer; }
    .flt { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; margin:0 0 10px; }
    @media (max-width:760px) { .flt { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    .flt select { min-width:0; border:1.5px solid var(--line); border-radius:10px; padding:9px 10px; font:700 14px 'Tajawal', sans-serif; background:var(--card); color:var(--ink); }
    .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0 12px; flex-wrap:wrap; }
    .bar h2 { margin:0; font-size:19px; font-weight:900; } .bar small { display:block; color:var(--muted); font-weight:700; font-size:12.5px; }
    .bar .r { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .tgl { display:flex; align-items:center; gap:6px; font-weight:800; font-size:13.5px; cursor:pointer; }
    .tgl input { width:18px; height:18px; accent-color:#0f766e; }
    .bar select { border:1.5px solid var(--line); border-radius:10px; padding:7px 10px; font:700 13.5px 'Tajawal', sans-serif; background:var(--card); color:var(--ink); }
    .list { display:grid; gap:12px; }
    .ag { display:grid; grid-template-columns:130px minmax(0, 1fr); background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; text-decoration:none; color:inherit; position:relative; min-height:150px; }
    @media (max-width:420px) { .ag { grid-template-columns:108px minmax(0, 1fr); } }
    .ag .ph { background:#eef2f7 center/cover no-repeat; min-height:150px; }
    .ag .ph.off { background:#0f172a; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:24px; text-align:center; padding:10px; line-height:1.3; overflow-wrap:anywhere; }
    .ag .bd { padding:12px 14px 10px; min-width:0; display:flex; flex-direction:column; gap:4px; }
    .ag b { font-size:17px; font-weight:800; line-height:1.4; padding-inline-end:46px; overflow-wrap:anywhere; }
    .ag .t { color:var(--muted); font-size:13px; font-weight:600; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:2px 0; }
    .tag { display:inline-flex; align-items:center; gap:4px; border-radius:5px; padding:1px 7px; font-size:11px; font-weight:900; }
    .tag.v { background:#312e81; color:#fff; } .tag.l { background:#dcfce7; color:#15803d; } .tag.x { background:#fee2e2; color:#b91c1c; }
    .ag .meta { color:var(--muted); font-size:12.5px; font-weight:600; line-height:1.7; } .ag .meta span { color:var(--ink); font-weight:700; }
    .ag .cnt { margin-top:auto; display:flex; gap:8px; flex-wrap:wrap; padding-top:6px; }
    .ag .cnt span { background:#f1f5f9; color:#334155; border-radius:6px; padding:3px 9px; font-size:12.5px; font-weight:800; }
    [data-theme="dark"] .ag .cnt span { background:#1e293b; color:#cbd5e1; }
    .ag .lg { position:absolute; top:10px; inset-inline-end:10px; width:40px; height:40px; border-radius:8px; object-fit:contain; background:#fff; border:1px solid var(--line); }
    .more { text-align:center; margin:14px 0; }
    .empty { text-align:center; padding:30px 16px; background:var(--card); border:1px solid var(--line); border-radius:16px; color:var(--muted); font-weight:700; line-height:1.9; }

    .oh .lgx { width:84px; height:84px; border-radius:12px; background:#0f172a center/contain no-repeat; flex:0 0 auto; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:30px; }

    .crumb { font-size:13px; font-weight:700; color:var(--muted); margin:0 0 10px; } .crumb a { color:#0f766e; text-decoration:none; }
