<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة عقار جديد | Aqaratti Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-turquoise: #00a896;
      --primary-turquoise-hover: #008072;
      --dubizzle-navy: #192038;
      --dubizzle-bg: #f7f9fc;
      --dubizzle-border: #e4e9f2;
      --text-dark: #222b45;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      background-color: var(--dubizzle-bg);
      color: var(--text-dark);
      padding: 30px 20px;
    }

    .form-container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--dubizzle-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .form-title {
      font-size: 22px;
      font-weight: 900;
      color: var(--dubizzle-navy);
      border-right: 4px solid var(--primary-turquoise);
      padding-right: 10px;
    }

    .btn-back {
      color: var(--primary-turquoise);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }

    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: 'Tajawal', sans-serif;
      outline: none;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .file-upload-box {
      border: 2px dashed #cbd5e1;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      background: #f8fafc;
      cursor: pointer;
    }

    #imagePreview {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
      object-fit: cover;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary-turquoise);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      margin-top: 15px;
    }

    .alert-msg {
      display: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 700;
      margin-bottom: 15px;
      text-align: center;
    }

    .alert-success { background: #e6f4ea; color: #137333; }
    .alert-error { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>

  <div class="form-container">
    <div class="header-bar">
      <h2 class="form-title"><i class="fas fa-plus-circle"></i> إضافة عقار جديد</h2>
      <a href="index.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة للموقع</a>
    </div>

    <div id="alertBox" class="alert-msg"></div>

    <form id="addPropertyForm">
      <div class="form-group">
        <label class="form-label">عنوان العقار</label>
        <input type="text" id="title" class="form-control" placeholder="مثال: فيلا شاطئية مع حديقة" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">السعر (AED)</label>
          <input type="number" id="price" class="form-control" placeholder="4500000" required>
        </div>
        <div class="form-group">
          <label class="form-label">المساحة (م²)</label>
          <input type="number" id="area_m2" class="form-control" placeholder="300" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">عدد الغرف</label>
          <input type="number" id="bedrooms" class="form-control" value="4" required>
        </div>
        <div class="form-group">
          <label class="form-label">عدد الحمامات</label>
          <input type="number" id="bathrooms" class="form-control" value="4" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">صورة العقار</label>
        <div class="file-upload-box" onclick="document.getElementById('fileInput').click();">
          <i class="fas fa-cloud-upload-alt" style="font-size: 28px; color: var(--primary-turquoise);"></i>
          <p>اضغط اختيار صورة من الاستوديو/الكمبيوتر</p>
          <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="previewFile(this)">
        </div>
        <img id="imagePreview" alt="معاينة الصورة">
        <p style="text-align: center; margin: 8px 0; font-size: 12px; color: #94a3b8;">── أو أدخل رابط صورة ──</p>
        <input type="url" id="imageUrlInput" class="form-control" placeholder="https://images.unsplash.com/...">
      </div>

      <button type="submit" class="btn-submit"><i class="fas fa-save"></i> نشر العقار فوراً</button>
    </form>
  </div>

  <script>
    let uploadedBase64Image = '';

    function previewFile(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedBase64Image = e.target.result;
          const preview = document.getElementById('imagePreview');
          preview.src = uploadedBase64Image;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    document.getElementById('addPropertyForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alertBox = document.getElementById('alertBox');
      const urlInput = document.getElementById('imageUrlInput').value.trim();
      const finalImage = uploadedBase64Image || urlInput;

      if (!finalImage) {
        alertBox.className = 'alert-msg alert-error';
        alertBox.innerText = '⚠️ يرجى اختيار صورة أو إدخال رابطها!';
        alertBox.style.display = 'block';
        return;
      }

      const propertyData = {
        title: document.getElementById('title').value,
        price: Number(document.getElementById('price').value),
        area_m2: Number(document.getElementById('area_m2').value),
        bedrooms: Number(document.getElementById('bedrooms').value),
        bathrooms: Number(document.getElementById('bathrooms').value),
        image: finalImage
      };

      try {
        const response = await fetch('http://localhost:3001/api/properties', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(propertyData)
        });

        const result = await response.json();
        if (result.status === 'success') {
          alertBox.className = 'alert-msg alert-success';
          alertBox.innerText = '🎉 تم نشر العقار بنجاح وتخزينه!';
          alertBox.style.display = 'block';
          setTimeout(() => window.location.href = 'index.html', 1200);
        }
      } catch (err) {
        alertBox.className = 'alert-msg alert-error';
        alertBox.innerText = '❌ تعذر اتصال السيرفر.';
        alertBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
