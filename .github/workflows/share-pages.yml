# يبني صفحات المشاركة /s/ (معاينة الإعلان بصورته في واتساب وفيسبوك وإكس)
# كل 20 دقيقة، وعند كل تحديث للموقع، ويمكن تشغيله يدويًا من تبويب Actions.
name: share-pages

on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [main]
    paths: ['properties.json', 'stays.json', 'cars.json', 'scripts/build-share-pages.mjs', 'scripts/build-seo-pages.mjs', 'js/aq-areas.js']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Hide listings not confirmed for 60 days (warn at 50)
        run: |
          URL=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" supabase-client.js); KEY=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" supabase-client.js)
          curl -s -m 30 -X POST "$URL/rest/v1/rpc/aq_expire_stale_listings" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' || true
      - name: Build share pages
        run: node scripts/build-share-pages.mjs
      - name: Build SEO pages (areas, listings, sitemap)
        run: node scripts/build-seo-pages.mjs
      - name: Commit if changed
        id: commit
        run: |
          git add -A s area property sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git config user.name "anaaqar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "تحديث صفحات مشاركة الإعلانات"
            git pull --rebase origin main
            git push
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi
      # الدفع بواسطة GITHUB_TOKEN لا يعيد نشر GitHub Pages تلقائيًا، فنطلب النشر صراحةً
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
