    <style>

</head>
<body>

    <div id="google_translate_element" style="display:none;"></div>

    <!-- شريط التنقل العلوي لصفحة البحث -->
    <header class="navbar-bayut">
        <div class="nav-right">
            <div class="logo" onclick="window.location.href='index.html'" style="cursor:pointer;"><i class="fas fa-home"></i> AqarX</div>
           <nav class="main-menu" style="display: flex; align-items: center; gap: 15px;">
    <a href="index.html">الرئيسية</a>
    <a href="search.html">تصفح العقارات</a>
    <a href="add-property.html" class="btn-add-prop" style="background: #28b16d; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.3s;">
        <i class="fas fa-plus-circle"></i> أعلن عن عقارك
    </a>
</nav>
        </div>
    </header>

    <!-- حاوية تقسيم الصفحة الرئيسية للبحث -->
    <div class="search-page-layout">
        
        <!-- أولاً: الفلاتر الجانبية التصفية -->
        <aside class="filter-sidebar">
            <h3 style="color:#08243c; margin-bottom: 15px;"><i class="fas fa-sliders-h"></i> تصفية النتائج</h3>
            <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #e2e8f0;">
            
            <div class="filter-box">
                <label>الغرض</label>
                <select id="sidebar-purpose">
                    <option value="buy">للبيع</option>
                    <option value="rent">للإيجار</option>
                </select>
            </div>

            <div class="filter-box">
                <label>نوع العقار</label>
                <select id="sidebar-type">
                    <option value="all">سكني</option>
                    <option value="commercial">تجاري</option>
                </select>
            </div>

            <div class="filter-box">
                <label>الحد الأقصى للسعر (درهم)</label>
                <input type="number" id="sidebar-price" placeholder="مثال: 5,000,000">
            </div>

            <button class="btn-apply" onclick="applyFilters()">تحديث النتائج</button>
        </aside>

        <!-- ثانياً: منطقة عرض بطاقات العقارات -->
        <main class="results-column">
            <h2 style="color: #08243c; margin-bottom: 20px;">العقارات المتاحة في الإمارات</h2>
            <div class="grid-container" id="search-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;">
                <!-- البطاقات ستعرض هنا تلقائياً -->
            </div>
        </main>

    </div>

    <!-- كود تشغيل الفلاتر الذكية والربط بين الصفحات -->
    <script>
        // 📦 قائمة العقارات الحقيقية: properties.json + عقارات الوسطاء المعتمدة من Supabase (نفس مصدر الصفحة الرئيسية)
        let propertiesData = [];

        async function loadRealProperties() {
            let jsonProperties = [];
            try {
                const response = await fetch('./properties.json?v=' + Date.now());
                jsonProperties = await response.json();
            } catch (err) {
                jsonProperties = [];
            }
            let supabaseProperties = [];
            try {
                supabaseProperties = await fetchApprovedSupabaseProperties();
            } catch (err) {
                supabaseProperties = [];
            }
            propertiesData = [...jsonProperties, ...supabaseProperties];
        }

        // دالة عرض البطاقات في الشبكة
      function displayResults(data) {
            const grid = document.getElementById('search-grid');
            grid.innerHTML = '';

            if(data.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666; font-size: 16px;">عذراً، لا توجد عقارات تطابق خيارات البحث الحالية.</p>';
                return;
            }

            data.slice(0, 60).forEach(item => {
                const img = item.image || (item.imagesList && item.imagesList[0]) || 'https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?q=80&w=600';
                // قمنا بتغليف الكارت برابط ينتقل لصفحة تفاصيل العقار ويمرر الـ ID الخاص به
                grid.innerHTML += `
                    <a href="javascript:void(0)" onclick="goToSearchPropertyDetails('${item.id}')" style="text-decoration: none; color: inherit;">
                        <div class="property-card" style="background:#fff; border-radius:12px; overflow:hidden; border:1px solid #d8dce0; box-shadow: 0 4px 10px rgba(0,0,0,0.02); cursor: pointer;">
                            <img src="${img}" alt="${item.title}" loading="lazy" style="width:100%; height:180px; object-fit:cover;">
                            <div style="padding:15px;">
                                <h3 style="color:#28b16d; font-size:18px; margin-bottom:5px;">${formatPriceAED(item.priceAED || item.price || 0)}</h3>
                                <p style="font-size:14px; font-weight:600; color:#222; height:40px; overflow:hidden;">${item.title}</p>
                                <span style="font-size:12px; background:#f0f2f5; padding:3px 8px; border-radius:4px; color:#555;">${item.propertyType || 'عقار'} ${item.city ? '- ' + item.city : ''}</span>
                            </div>
                        </div>
                    </a>
                `;
            });
        }

        function goToSearchPropertyDetails(propId) {
            const selectedProp = propertiesData.find(p => p.id.toString() === propId.toString());
            if (selectedProp) localStorage.setItem('aqarx_selected_property', JSON.stringify(selectedProp));
            window.location.href = `property-details.html?id=${propId}`;
        }

        let keywordFromUrl = '';

        // دالة الفلترة والتصفية بناءً على قيم المدخلات الحالية
        function filterAndRender() {
            const purpose = document.getElementById('sidebar-purpose').value; // 'buy' أو 'rent'
            const type = document.getElementById('sidebar-type').value; // 'all' أو 'commercial'
            const maxPrice = document.getElementById('sidebar-price').value;

            const filtered = propertiesData.filter(item => {
                // توافق الغرض (بيع / إيجار) - dealType الحقيقي يكون 'sale' أو 'rent'
                const matchesPurpose = purpose === 'buy' ? (item.dealType === 'sale' || !item.dealType) : (item.dealType === 'rent');
                // توافق النوع (سكني / تجاري)
                const isCommercial = (item.propertyType || '').includes('تجاري');
                const matchesType = (type === 'all') ? !isCommercial : isCommercial;
                // توافق السعر
                const price = item.priceAED || item.price || 0;
                const matchesPrice = !maxPrice || price <= parseInt(maxPrice);
                // توافق كلمة البحث (قادمة من صندوق بحث جوجل أو الصفحة الرئيسية)
                const kw = keywordFromUrl.toLowerCase();
                const matchesKeyword = !kw || (item.title && item.title.toLowerCase().includes(kw)) || (item.city && item.city.toLowerCase().includes(kw)) || (item.description && item.description.toLowerCase().includes(kw));

                return matchesPurpose && matchesType && matchesPrice && matchesKeyword;
            });

            displayResults(filtered);
        }

        function applyFilters() {
            filterAndRender();
        }

        // قراءة الاختيارات القادمة من الصفحة الرئيسية فور تحميل صفحة البحث
        window.onload = async () => {
            const params = new URLSearchParams(window.location.search);
            const purposeFromHome = params.get('purpose'); // القيمة الممررة من زر للبيع/للايجار بالرئيسية
            const typeFromHome = params.get('type');       // نوع العقار من القائمة المنسدلة بالرئيسية
            keywordFromUrl = params.get('keyword') || '';  // كلمة البحث القادمة من صندوق بحث جوجل (SearchAction)

            // تحديث قيم الفلاتر الجانبية لتطابق ما اختاره المستخدم في الصفحة الرئيسية
            if (purposeFromHome) {
                document.getElementById('sidebar-purpose').value = purposeFromHome;
            }
            if (typeFromHome && typeFromHome !== 'all') {
                // تحويل المسميات الإنجليزية القادمة من القائمة لتبسيط قراءتها
                document.getElementById('sidebar-type').value = (typeFromHome === 'تجاري' || typeFromHome === 'office') ? 'commercial' : 'all';
            }

            document.getElementById('search-grid').innerHTML = '<p style="grid-column: 1/-1; text-align:center; padding:40px; color:#666;">جاري تحميل العقارات...</p>';
            await loadRealProperties();

            // تشغيل التصفية الفورية وعرض العقارات الصحيحة فقط
            filterAndRender();
        };

        document.addEventListener('DOMContentLoaded', () => {
            const savedDir = localStorage.getItem('aqarx_lang_dir');
            if (savedDir) document.documentElement.setAttribute('dir', savedDir);
        });
    </script>
